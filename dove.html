<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Home2Love · Casa</title>
<link rel="manifest" href="dove.webmanifest">
<link rel="icon" href="icone/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  /* Home2Love — "Dove siete?" con il cielo di Bologna dietro. Sullo sfondo il cielo disegnato dal vivo con il meteo vero
     (sole e luna dove sono, nuvole, pioggia, neve, nebbia, lampi; i tetti, l'Asinelli e San Luca); davanti un orologio con due lancette,
     una per persona, che indicano Casa · In viaggio · Lavoro · Fuori (con il posto scritto dal telefono, «📍 Esco»). Si muove da solo con i turni
     e con "Sto tornando": la lancetta di chi torna scivola piano dal Lavoro verso Casa. */
  :root { --ink: #f4ead9; --muted: rgba(244,234,217,.55); --bg: #120d0a; --card: #1d1612; --line: rgba(201,165,106,.25); --accent: #c9a56a; --p0: #ff9a62; --p1: #52d1c6; --ottone: #c9a56a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 40%, #2a1f17 0%, #120d0a 55%, #070504 100%); color: var(--ink);
         font-family: Outfit, system-ui, sans-serif; user-select: none; -webkit-user-select: none; transition: filter 3s; }
  body.notte { filter: brightness(.6) saturate(.85); }
  #scena { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; }
  canvas#tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #testo { position: absolute; z-index: 1; left: max(5vmin, env(safe-area-inset-left)); top: max(5vmin, env(safe-area-inset-top)); text-shadow: 0 2px 18px rgba(0,0,0,.35); transition: transform 4s; color: #fff; }
  #temp { font-size: min(15vmin, 110px); font-weight: 200; line-height: .9; letter-spacing: -.02em; }
  #temp small { font-size: .38em; vertical-align: top; position: relative; top: .25em; margin-left: .05em; }
  #descr { font-size: min(4.2vmin, 28px); font-weight: 300; margin-top: 1.2vmin; opacity: .95; }
  #pioggia { font-size: min(3.4vmin, 22px); font-weight: 300; margin-top: .8vmin; opacity: .8; }
  #q-ora { font-size: min(3vmin, 19px); font-weight: 300; margin-top: 2.2vmin; opacity: .6; letter-spacing: .04em; }
  #tutto { position: absolute; z-index: 2; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 5vmin; padding: 4vmin;
           padding-top: max(4vmin, env(safe-area-inset-top)); padding-bottom: max(4vmin, env(safe-area-inset-bottom)); transition: transform 4s; }
  body.vert #tutto { flex-direction: column; justify-content: flex-end; padding-bottom: max(6vmin, env(safe-area-inset-bottom)); }
  body.oriz #tutto { flex-direction: row-reverse; justify-content: space-between; align-items: flex-end; padding: 5vmin 5vmin 5vmin max(5vmin, env(safe-area-inset-left)); }
  /* l'orologio più piccolo, in un angolo, così il cielo si vede */
  #quadrante { width: 62vmin; height: 62vmin; flex: none; filter: drop-shadow(0 2vmin 4vmin rgba(0,0,0,.5)); }
  body.oriz #quadrante { width: 58vmin; height: 58vmin; }
  .lancetta { transition: transform 3.2s cubic-bezier(.3, 1.35, .45, 1); }
  #lancette text { transform-box: view-box; }
  .etichetta { font-family: "Cormorant Garamond", serif; font-weight: 600; letter-spacing: .32em; font-size: 8.6px; fill: #e9d6b0; }
  #righe { display: flex; flex-direction: column; gap: 2.6vmin; text-shadow: 0 2px 14px rgba(0,0,0,.6); min-width: 0; max-width: 90vmin; }
  body.vert #righe { width: 88vmin; }
  body.oriz .riga .nome { font-size: min(4.6vmin, 34px); } body.oriz .riga .dove { font-size: min(3vmin, 20px); }
  .dentro #b-ruota { display: none; }
  #b-ruota { position: absolute; z-index: 3; right: 2.6vmin; top: 2.6vmin; width: 9vmin; height: 9vmin; max-width: 52px; max-height: 52px; border: 0; border-radius: 50%;
             background: rgba(0,0,0,.18); color: rgba(255,255,255,.55); font-size: min(4.4vmin, 24px); cursor: pointer; }
  .riga { display: flex; gap: 2.6vmin; align-items: flex-start; }
  .riga .bollo { margin-top: .4vmin; }
  .riga .bollo { width: 7vmin; height: 7vmin; max-width: 54px; max-height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center;
                 font: 600 min(3.4vmin, 26px) Outfit, sans-serif; color: #1a120c; box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.4); }
  .riga .nome { font-family: "Cormorant Garamond", serif; font-size: min(5.4vmin, 40px); font-weight: 600; line-height: 1; }
  .riga .dove { font-size: min(3.3vmin, 22px); font-weight: 300; color: var(--muted); margin-top: .6vmin; }
  .riga .dove b { color: var(--ink); font-weight: 400; }
  .riga .tx { min-width: 0; flex: 1; }
  .viaggio { margin-top: 1.2vmin; max-width: 52vmin; }
  .vg-riga { display: flex; align-items: center; gap: 1.4vmin; font-size: min(3vmin, 19px); }
  .vg-ico { font-size: min(4vmin, 26px); }
  .vg-barra { flex: 1; height: 1vmin; min-height: 5px; border-radius: 1vmin; background: rgba(255,255,255,.18); overflow: hidden; }
  .vg-barra i { display: block; height: 100%; border-radius: 1vmin; }
  .vg-tempo { white-space: nowrap; font-weight: 400; }
  .vg-mappa { display: block; width: 100%; max-width: 46vmin; height: auto; margin-top: 1vmin; background: rgba(0,0,0,.22); border-radius: 1.6vmin; }
  .vg-km { font-size: min(2.5vmin, 15px); color: var(--muted); margin-top: .6vmin; }
</style>
</head>
<body>
<div id="scena">
<canvas id="tela"></canvas>
<button id="b-ruota" type="button" aria-label="Gira lo schermo">⟳</button>
<div id="testo"><div id="temp">–</div><div id="descr"></div><div id="pioggia"></div><div id="q-ora"></div></div>
<div id="tutto">
  <svg id="quadrante" viewBox="-100 -100 200 200" aria-label="Dove siete?">
    <defs>
      <radialGradient id="g-faccia" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#2b3550" stop-opacity=".78"/><stop offset=".6" stop-color="#161c2e" stop-opacity=".8"/><stop offset="1" stop-color="#0a0d18" stop-opacity=".86"/></radialGradient>
      <linearGradient id="g-ottone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca4"/><stop offset=".35" stop-color="#c9a56a"/><stop offset=".7" stop-color="#7d5b2c"/><stop offset="1" stop-color="#d9bb80"/></linearGradient>
      <linearGradient id="g-ottone2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cf96"/><stop offset=".5" stop-color="#6e4f25"/><stop offset="1" stop-color="#c9a56a"/></linearGradient>
      <radialGradient id="g-vetro" cx="35%" cy="25%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <path id="arco-su" d="M -71 0 A 71 71 0 0 1 71 0"/>
      <path id="arco-giu" d="M -71 0 A 71 71 0 0 0 71 0"/>
      <filter id="ombra" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2.2" stdDeviation="1.6" flood-color="#000" flood-opacity=".55"/></filter>
    </defs>
    <circle r="99" fill="url(#g-ottone)"/>
    <circle r="93" fill="url(#g-ottone2)"/>
    <circle r="89.5" fill="#0b0e19" fill-opacity=".55"/>
    <circle r="88" fill="url(#g-faccia)"/>
    <g id="settori"></g>
    <g id="tacche"></g>
    <g id="scritte"></g>
    <text y="-17" text-anchor="middle" style="font: italic 500 7px 'Cormorant Garamond', serif; fill: rgba(233,214,176,.45); letter-spacing: .18em">Home 2 Love</text>
    <g id="lancette"></g>
    <circle r="7.5" fill="url(#g-ottone)" filter="url(#ombra)"/>
    <circle r="3" fill="#6e4f25"/>
    <circle r="88" fill="url(#g-vetro)" pointer-events="none"/>
  </svg>
  <div id="righe"></div>
</div>
</div>

<script src="comune.js?v=90"></script>
<script src="telecomando.js?v=90"></script>
<script>
// ================= il quadrante =================
var POSTI = { casa: { a: 0, nome: "CASA", icona: "⌂" }, viaggio: { a: 90, nome: "IN VIAGGIO", icona: "➝" }, lavoro: { a: 180, nome: "LAVORO", icona: "✦" }, fuori: { a: 270, nome: "FUORI", icona: "⚑" } };
var VIAGGIO = 30;   // minuti di strada stimati prima e dopo un turno (se non c'è "Sto tornando")
var NS = "http://www.w3.org/2000/svg";
function svg(tag, attr, dentro) { var e = document.createElementNS(NS, tag); for (var k in attr) e.setAttribute(k, attr[k]); if (dentro) dentro.appendChild(e); return e; }
function punto(a, r) { var x = (a - 90) * Math.PI / 180; return [Math.cos(x) * r, Math.sin(x) * r]; }
function costruisci() {
  var set = $("settori"), tac = $("tacche"), scr = $("scritte");
  Object.keys(POSTI).forEach(function (k, i) {   // spicchi appena più chiari, uno sì e uno no
    var a = POSTI[k].a, p1 = punto(a - 45, 86), p2 = punto(a + 45, 86);
    svg("path", { d: "M0 0 L" + p1 + " A86 86 0 0 1 " + p2 + " Z", fill: i % 2 ? "rgba(255,255,255,.025)" : "rgba(201,165,106,.05)" }, set);
    var l = punto(a + 45, 86), l2 = punto(a + 45, 18);
    svg("line", { x1: l2[0], y1: l2[1], x2: l[0], y2: l[1], stroke: "rgba(201,165,106,.28)", "stroke-width": ".5" }, set);
    // nome del posto lungo il bordo (in basso le scritte girano per restare dritte)
    var g = svg("g", { transform: "rotate(" + (a > 90 && a < 270 ? a - 180 : a) + ")" }, scr);
    var t = svg("text", { "class": "etichetta", "text-anchor": "middle", dy: a > 90 && a < 270 ? "7.5" : "0" }, g);
    var tp = svg("textPath", { href: a > 90 && a < 270 ? "#arco-giu" : "#arco-su", startOffset: "50%" }, t); tp.textContent = POSTI[k].nome;
  });
  for (var i = 0; i < 72; i++) {   // tacche come un vecchio orologio
    var lunga = i % 6 === 0, a = i * 5, p1 = punto(a, 86), p2 = punto(a, lunga ? 80.5 : 83.5);
    svg("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: lunga ? "rgba(233,214,176,.7)" : "rgba(233,214,176,.3)", "stroke-width": lunga ? "1" : ".5", "stroke-linecap": "round" }, tac);
  }
  [0, 1].forEach(function (p) {   // le lancette: affusolate, con il medaglione dell'iniziale in punta
    var g = svg("g", { "class": "lancetta", id: "lan" + p }, $("lancette")), col = p ? "#52d1c6" : "#ff9a62", lungh = p ? 46 : 58;
    var h = svg("g", { filter: "url(#ombra)" }, g);
    svg("path", { d: "M -2.6 12 L -1.3 -" + (lungh - 9) + " L 0 -" + (lungh - 6) + " L 1.3 -" + (lungh - 9) + " L 2.6 12 Z", fill: col }, h);
    svg("path", { d: "M 0 12 L 0 -" + (lungh - 7), stroke: "rgba(255,255,255,.35)", "stroke-width": ".5" }, h);
    svg("circle", { cy: -lungh + 2, r: 8.4, fill: "url(#g-ottone)" }, h);
    svg("circle", { cy: -lungh + 2, r: 6.9, fill: col }, h);
    var t = svg("text", { id: "ini" + p, "class": "lancetta", y: -lungh + 5.6, "text-anchor": "middle", style: "font: 600 9.5px Outfit, sans-serif; fill: #1a120c; transform-origin: 0 " + (-lungh + 2) + "px" }, h);
    t.textContent = "?";   // l'iniziale gira al contrario della lancetta: resta sempre dritta
    g.style.transformOrigin = "0 0"; g.style.transformBox = "view-box";
  });
}

// ================= dove si trova ognuno =================
function minDi(d) { return d.getHours() * 60 + d.getMinutes(); }
function hm(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; return Math.floor(min / 60) + ":" + due(min % 60); }
function nome(p) { return (cfg.nomi[p] || (p ? "Lei" : "Lui")).split(" ")[0]; }
function fasceIntorno(d, p) {   // ieri, oggi e domani, in minuti rispetto alla mezzanotte di oggi
  var l = [];
  [-1, 0, 1].forEach(function (g) { fasceGiorno(piuGiorni(d, g), p).forEach(function (f) { l.push([f[0] + g * 1440, f[1] + g * 1440]); }); });
  return l.sort(function (a, b) { return a[0] - b[0]; });
}
function dove(p, d) {
  var m = minDi(d), r = rientroDi(p), f = fasceIntorno(d, p), i;
  if (r && Date.now() < r.arrivo) {
    var prog = Math.max(0, Math.min(1, (Date.now() - (r.t || Date.now())) / Math.max(1, r.arrivo - (r.t || Date.now()))));
    return { posto: "viaggio", angolo: 180 - 180 * prog, testo: "sta tornando · arriva alle <b>" + oraHM(r.arrivo) + "</b>" };
  }
  var fu = fuoriDi(p);
  if (fu) return { posto: "fuori", testo: "fuori · <b>" + fu.dove.replace(/[<>&]/g, "") + "</b>" };
  for (i = 0; i < f.length; i++) if (m >= f[i][0] && m < f[i][1]) return { posto: "lavoro", testo: "al lavoro fino alle <b>" + hm(f[i][1]) + "</b>" };
  for (i = 0; i < f.length; i++) if (m >= f[i][0] - VIAGGIO && m < f[i][0]) return { posto: "viaggio", angolo: 180 * (m - f[i][0] + VIAGGIO) / VIAGGIO, testo: "sta andando al lavoro · attacca alle <b>" + hm(f[i][0]) + "</b>" };
  for (i = 0; i < f.length; i++) if (m >= f[i][1] && m < f[i][1] + VIAGGIO) return { posto: "viaggio", angolo: 180 - 180 * (m - f[i][1]) / VIAGGIO, testo: "dovrebbe essere per strada verso casa" };
  var prossimo = f.filter(function (x) { return x[0] > m; })[0];
  var dopo = prossimo ? (prossimo[0] < 1440 ? "oggi attacca alle <b>" + hm(prossimo[0]) + "</b>" : prossimo[0] < 2880 ? "domani attacca alle <b>" + hm(prossimo[0]) + "</b>" : "") : "";
  return { posto: "casa", testo: "a casa" + (dopo ? " · " + dopo : "") };
}

// ================= disegno =================
var angoli = [null, null];
function giraVerso(p, a) {   // sceglie il giro più corto (mai un giro intero all'indietro)
  var prima = angoli[p]; if (prima !== null) { while (a - prima > 180) a -= 360; while (prima - a > 180) a += 360; }
  angoli[p] = a; $("lan" + p).style.transform = "rotate(" + a + "deg)"; $("ini" + p).style.transform = "rotate(" + (-a) + "deg)";
}
function disegna() {
  var d = new Date(), s = [dove(0, d), dove(1, d)];
  var a = s.map(function (x) { return x.angolo !== undefined ? x.angolo : POSTI[x.posto].a; });
  if (Math.abs(a[0] - a[1]) < 10) { a[0] -= 7; a[1] += 7; }   // nello stesso posto: affiancate, si vedono tutte e due
  [0, 1].forEach(function (p) {
    giraVerso(p, a[p]);
    $("ini" + p).textContent = nome(p).charAt(0).toUpperCase();
    var riga = $("riga" + p);
    if (!riga) {
      riga = el("div", "riga"); riga.id = "riga" + p;
      riga.innerHTML = '<div class="bollo"></div><div class="tx"><div class="nome"></div><div class="dove"></div></div>';
      riga.querySelector(".bollo").style.background = p ? "var(--p1)" : "var(--p0)";
      $("righe").appendChild(riga);
    }
    riga.querySelector(".bollo").textContent = nome(p).charAt(0).toUpperCase();
    riga.querySelector(".nome").textContent = nome(p);
    riga.querySelector(".dove").innerHTML = s[p].testo;
    disegnaViaggio(riga, p);
  });
  var h = d.getHours(); document.body.classList.toggle("notte", h >= 23 || h < 7);
}
// chi sta tornando: mezzo, conto alla rovescia, barra e il percorso disegnato con il pallino che avanza
function disegnaViaggio(riga, p) {
  var v = riga.querySelector(".viaggio"), r = rientroDi(p);
  if (!r || Date.now() >= r.arrivo) { if (v) v.remove(); return; }
  if (!v) { v = el("div", "viaggio"); riga.querySelector(".tx").appendChild(v); }
  var inizio = r.t || Date.now(), prog = Math.max(0, Math.min(1, (Date.now() - inizio) / Math.max(1, r.arrivo - inizio)));
  var resta = Math.max(0, Math.round((r.arrivo - Date.now()) / 60000)), ico = r.mezzo === "bici" ? "🚲" : r.mezzo === "piedi" ? "🚶" : "🚗";
  var col = p ? "var(--p1)" : "var(--p0)", html = '<div class="vg-riga"><span class="vg-ico">' + ico + '</span><span class="vg-barra"><i style="width:' + (prog * 100).toFixed(1) + '%;background:' + col + '"></i></span>' +
    '<span class="vg-tempo">' + (resta <= 1 ? "a momenti" : "tra " + resta + " min") + '</span></div>';
  if (r.punti && r.punti.length > 1) {   // percorso: lo adatto a un riquadro 200×70, con il nord in alto
    var lat = r.punti.map(function (x) { return x[0]; }), lon = r.punti.map(function (x) { return x[1]; });
    var k = Math.cos(lat[0] * Math.PI / 180), x0 = Math.min.apply(null, lon), x1 = Math.max.apply(null, lon), y0 = Math.min.apply(null, lat), y1 = Math.max.apply(null, lat);
    var w = Math.max(1e-6, (x1 - x0) * k), h = Math.max(1e-6, y1 - y0), sc = Math.min(184 / w, 54 / h), ox = (200 - w * sc) / 2, oy = (70 - h * sc) / 2;
    var pt = r.punti.map(function (x) { return [ox + (x[1] - x0) * k * sc, oy + (y1 - x[0]) * sc]; });
    var dd = "M" + pt.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L");
    var lung = 0, tratti = []; for (var i = 1; i < pt.length; i++) { var l = Math.hypot(pt[i][0] - pt[i - 1][0], pt[i][1] - pt[i - 1][1]); tratti.push(l); lung += l; }
    var obiettivo = lung * prog, pos = pt[0];
    for (var j = 0, acc = 0; j < tratti.length; j++) { if (acc + tratti[j] >= obiettivo) { var f = tratti[j] ? (obiettivo - acc) / tratti[j] : 0; pos = [pt[j][0] + (pt[j + 1][0] - pt[j][0]) * f, pt[j][1] + (pt[j + 1][1] - pt[j][1]) * f]; break; } acc += tratti[j]; pos = pt[j + 1]; }
    var fine = pt[pt.length - 1];
    html += '<svg class="vg-mappa" viewBox="0 0 200 70"><path d="' + dd + '" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + dd + '" fill="none" stroke="' + (p ? "#52d1c6" : "#ff9a62") + '" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="' + lung.toFixed(1) + '" stroke-dashoffset="' + (lung - obiettivo).toFixed(1) + '"/>' +
      '<text x="' + fine[0].toFixed(1) + '" y="' + (fine[1] + 5).toFixed(1) + '" text-anchor="middle" font-size="13">🏠</text>' +
      '<circle cx="' + pos[0].toFixed(1) + '" cy="' + pos[1].toFixed(1) + '" r="5" fill="#fff" stroke="' + (p ? "#52d1c6" : "#ff9a62") + '" stroke-width="2.5"/></svg>';
    if (r.km) html += '<div class="vg-km">' + String(r.km).replace(".", ",") + ' km · partito alle ' + oraHM(inizio) + '</div>';
  }
  v.innerHTML = html;
}
function ridisegna() { disegna(); }

// ================= schermo: sempre acceso, a tutto schermo, e un leggero spostamento contro i segni sullo schermo =================
var DENTRO = window.parent !== window;
if (DENTRO) document.documentElement.classList.add("dentro");
function tieniAcceso() { if (DENTRO) return; if ("wakeLock" in navigator && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {}); }
document.addEventListener("visibilitychange", tieniAcceso);
if (DENTRO) { salvaCfg = function () {}; reg = leggi("cucina_registro", null) || {}; }   // nel tablet non scrivo niente: ci pensa lui
document.addEventListener("click", function () {
  if (DENTRO) return;
  var e = document.documentElement; if (!document.fullscreenElement && e.requestFullscreen) e.requestFullscreen().catch(function () {});
});
setInterval(function () {   // contro i segni sullo schermo
  var t = "translate(" + Math.round(Math.random() * 8 - 4) + "px," + Math.round(Math.random() * 8 - 4) + "px)"; $("tutto").style.transform = t; $("testo").style.transform = t;
}, 120000);

// ================= il cielo di Bologna, dal vivo, con il meteo vero (Open-Meteo) =================
(function () {
var prova = new URLSearchParams(location.search);   // ?prova=pioggia|neve|temporale|nebbia|sereno|nuvoloso&ora=21:30 per vederlo subito
function adesso() {

      nb.addColorStop(0, css(nc, 0)); nb.addColorStop(.5, css(nc, t === "nebbia" ? .42 : .18)); nb.addColorStop(1, css(nc, 0));
      g.fillStyle = nb; g.fillRect(fx - W * .2, fy - 90, W * 1.4, 180);
    }
  }
  // pioggia e neve
  if (GOCCE.length) {
    var neve = t === "neve";
    g.strokeStyle = css(mix([200, 214, 236], [120, 135, 160], 1 - L), .42); g.lineWidth = 1.1; g.fillStyle = css(mix([255, 255, 255], [170, 180, 200], 1 - L), .85);
    if (!neve) g.beginPath();
    GOCCE.forEach(function (p) {
      if (neve) {
        p.y += (28 + p.v * 30) * dt; p.x += (vx * 1.2 + Math.sin(ora / 900 + p.r * 9) * 14) * dt;
        g.beginPath(); g.arc(p.x, p.y, 1 + p.r * 2.2, 0, 7); g.fill();
      } else {
        var vy = 620 + p.v * 380, sp = vx * 9; p.y += vy * dt; p.x += sp * dt;
        g.moveTo(p.x, p.y); g.lineTo(p.x - sp * .028, p.y - (12 + p.v * 12));
      }
      if (p.y > H + 20) { p.y = -20 - Math.random() * 60; p.x = Math.random() * (W + 200) - 100; }
      if (p.x > W + 120) p.x -= W + 200; if (p.x < -120) p.x += W + 200;
    });
    if (!neve) g.stroke();
  }
}

// ================= girare lo schermo anche con la rotazione automatica spenta =================
// ⟳ automatico (come il telefono) · ▭ orizzontale · ▭ orizzontale al contrario · ▯ verticale
var verso = leggi("casa_verso", "auto");
function applicaVerso() {
  var sc = $("scena"), w = innerWidth, h = innerHeight, giro = 0;
  if ((verso === "dx" || verso === "sx") && h > w) giro = verso === "dx" ? 90 : -90;
  if (verso === "vert" && w > h) giro = 90;
  if (giro) { sc.style.width = h + "px"; sc.style.height = w + "px"; sc.style.transform = giro > 0 ? "translateX(" + w + "px) rotate(90deg)" : "translateY(" + h + "px) rotate(-90deg)"; }
  else { sc.style.width = w + "px"; sc.style.height = h + "px"; sc.style.transform = ""; }
  var ow = giro ? h : w, oh = giro ? w : h;
  document.body.classList.toggle("oriz", ow > oh); document.body.classList.toggle("vert", ow <= oh);
  $("b-ruota").textContent = { auto: "⟳", dx: "▭", sx: "▭", vert: "▯" }[verso];
  window.dispatchEvent(new Event("scena"));
}
$("b-ruota").onclick = function (e) {
  e.stopPropagation(); var l = ["auto", "dx", "sx", "vert"]; verso = l[(l.indexOf(verso) + 1) % l.length]; salva("casa_verso", verso); applicaVerso();
  this.style.opacity = 1; clearTimeout(this.t); var b = this; b.t = setTimeout(function () { b.style.opacity = ""; }, 3000);
};
addEventListener("resize", applicaVerso);
applicaVerso();
