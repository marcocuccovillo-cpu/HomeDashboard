  /* Home2Love — La stanza del gatto: un telefono avanzato appoggiato in casa diventa la casetta del gatto.

     e una finestra con il cielo e il tempo veri di Bologna. La luce cambia con l'ora (sole dalla finestra,
     sera calda, notte con la lampada). Il gatto segue la casa: aspetta alla porta chi ha premuto "Sto tornando",
     fa i cuori quando vi pensate, dorme di notte o quando siete fuori, cappellino a feste e compleanni.
     Toccalo per le coccole; tocca le ciotole per riempirle. */
  :root { --ink: #fff5ec; --muted: rgba(255,245,236,.7); }

  #fumetto::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -1.4vmin; border: 1.4vmin solid transparent; border-top-color: #fff; }
  #fumetto.via { opacity: 0; }
  #info { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 1.6vmin 3vmin; padding-bottom: max(1.6vmin, env(safe-area-inset-bottom)); display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline;
          background: linear-gradient(transparent, rgba(20,12,10,.6)); font-size: 2.8vmin; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #ora { font-size: 4.6vmin; font-weight: 300; margin-right: 2.4vmin; } #noi { color: var(--muted); -webkit-flex: 1; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #noi b { color: var(--ink); font-weight: 600; }
  #b-ruota { position: absolute; z-index: 4; right: 1.6vmin; top: 1.6vmin; width: 8vmin; height: 8vmin; max-width: 46px; max-height: 46px; border: 0; border-radius: 50%; background: rgba(0,0,0,.18); color: rgba(255,255,255,.65); font-size: 20px; cursor: pointer; }
  .cuore { position: absolute; z-index: 3; color: #ff5468; font-size: 4.4vmin; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.2); -webkit-animation: sale 1.6s ease-out forwards; animation: sale 1.6s ease-out forwards; }
  @-webkit-keyframes sale { from { opacity: 1; -webkit-transform: translate(-50%, 0) scale(.8); } to { opacity: 0; -webkit-transform: translate(-50%, -14vmin) scale(1.3); } }
  @keyframes sale { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -14vmin) scale(1.3); } }
</style>

function ciotola(x, tipo, livello) {
  g.fillStyle = "rgba(0,0,0,.18)"; ell(x, PAV + 6, 36, 7); g.fill();
  g.fillStyle = lin(x - 34, 0, x + 34, 0, [[0, "#d8dde6"], [.5, "#ffffff"], [1, "#c9cfda"]]); g.beginPath(); g.moveTo(x - 34, PAV - 22); g.lineTo(x + 34, PAV - 22); g.lineTo(x + 26, PAV + 2); g.lineTo(x - 26, PAV + 2); g.closePath(); g.fill();
  g.fillStyle = tipo === "cibo" ? "#e89b5a" : "#6fb8e8"; g.fillRect(x - 30, PAV - 14, 60, 5);
  g.fillStyle = "#eef1f5"; ell(x, PAV - 22, 34, 8); g.fill(); g.fillStyle = "#c9cfda"; ell(x, PAV - 22, 28, 5.5); g.fill();
  var l = Math.max(0, Math.min(100, livello)) / 100;
  if (l > .02) {
    if (tipo === "cibo") { for (var i = 0; i < Math.round(14 * l); i++) { g.fillStyle = i % 2 ? "#9b5a2e" : "#b56d3a"; ell(x - 20 + (i * 37 % 40), PAV - 23 - (i % 3) - l * 3, 4, 3); g.fill(); } }
    else { g.fillStyle = "rgba(90,170,235,.85)"; ell(x, PAV - 22 - l * 2, 25 * (.6 + l * .4), 4.5 * (.6 + l * .4)); g.fill(); g.fillStyle = "rgba(255,255,255,.6)"; ell(x - 8, PAV - 23 - l * 2, 6, 1.2); g.fill(); }
  }
}
function gomitolo(x) {
  var p = ST.palla; g.fillStyle = "rgba(0,0,0,.18)"; ell(x, PAV + 4, 16, 4); g.fill();
  g.save(); g.translate(x, PAV - 13); g.rotate(p.giro);
  g.fillStyle = rad(-4, -4, 2, 16, [[0, "#6fd0c4"], [1, "#2f9488"]]); ell(0, 0, 14, 14); g.fill();
  g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1.4; for (var k = -8; k <= 8; k += 4) { g.beginPath(); g.ellipse(0, 0, 13, Math.abs(k) + 3, .6, 0, Math.PI); g.stroke(); }
  g.restore();
  g.strokeStyle = "#3aa79a"; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x - 6, PAV - 2); g.quadraticCurveTo(x - 30, PAV + 6, x - 52, PAV + 1); g.stroke();
}

// ---------------- un fotogramma
function disegna(t) {
  var m = momento();
  if (sfondoMin !== new Date().getMinutes()) rifaiSfondo();
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, tela.width, tela.height);
  g.setTransform(SCALA * DPR, 0, 0, SCALA * DPR, OFX * DPR, OFY * DPR);
  cielo(t, m);
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(SFONDO, 0, 0);
  g.setTransform(SCALA * DPR, 0, 0, SCALA * DPR, OFX * DPR, OFY * DPR);
  ciotola(POSTI.cibo, "cibo", CIOT.cibo); ciotola(POSTI.acqua, "acqua", CIOT.acqua);
  // lama di sole dalla finestra
  if ((m.nome === "giorno" || m.nome === "tramonto") && (METEO.tipo === "sereno" || METEO.tipo === "nuvoloso")) {
    g.fillStyle = lin(0, 330, 0, PAV + 30, [[0, "rgba(255,236,180,.22)"], [1, "rgba(255,236,180,0)"]]);
    g.beginPath(); g.moveTo(382, 340); g.lineTo(618, 340); g.lineTo(720, PAV + 30); g.lineTo(460, PAV + 30); g.closePath(); g.fill();
  }
  var dorme = ST.posa === "dorme" && Math.abs(ST.x - POSTI.cuccia) < 4;
  if (!dorme) gomitolo(ST.palla.x);
  g.save(); if (dorme) g.translate(0, -12);
  GATTO_VET.disegna(g, ST.x, PAV, ST.posa, t, ST.verso, { blink: ST.occhi > 0, fusa: ST.fusa > 0, cappello: ST.cappello }); g.restore();
  if (dorme) gomitolo(ST.palla.x);
  // luce dell'ora: sera calda, notte buia con la lampada
  var x0 = -OFX / SCALA, x1 = (SW - OFX) / SCALA, y0 = -OFY / SCALA, y1 = (SH - OFY) / SCALA;
  if (m.caldo) { g.fillStyle = "rgba(255,150,70," + m.caldo + ")"; g.fillRect(x0, y0, x1 - x0, y1 - y0); }
  if (m.buio) { g.fillStyle = "rgba(10,14,40," + m.buio + ")"; g.fillRect(x0, y0, x1 - x0, y1 - y0); }
  if (m.lampada) {
    g.save(); g.globalCompositeOperation = "lighter";
    g.fillStyle = rad(70, 210, 10, 420, [[0, "rgba(255,190,110," + (.42 * m.lampada) + ")"], [.5, "rgba(255,160,80," + (.12 * m.lampada) + ")"], [1, "rgba(255,160,80,0)"]]); g.fillRect(x0, y0, 600, y1 - y0);
    g.fillStyle = lin(0, 212, 0, PAV, [[0, "rgba(255,210,140," + (.28 * m.lampada) + ")"], [1, "rgba(255,210,140,0)"]]);
    g.beginPath(); g.moveTo(26, 212); g.lineTo(114, 212); g.lineTo(220, PAV + 20); g.lineTo(-80, PAV + 20); g.closePath(); g.fill();
    g.restore();
    g.fillStyle = "rgba(255,226,170," + (.9 * m.lampada) + ")"; g.beginPath(); g.moveTo(42, 140); g.lineTo(98, 140); g.lineTo(116, 212); g.lineTo(24, 212); g.closePath(); g.fill();
  }
}

// ================= cosa fa il gatto =================
function rientroDiQualcuno() { for (var p = 0; p < 2; p++) { var r = rientroDi(p); if (r && Date.now() < r.arrivo) return { p: p, r: r }; } return null; }
function tuttiFuori() { return [0, 1].every(function (p) { var st = statoAdesso(p); return st.stato === "lavoro" || !!fuoriDi(p); }); }
function nome(p) { return (cfg.nomi[p] || (p ? "Lei" : "Lui")).split(" ")[0]; }
function scegli() {
  var d = new Date(), h = d.getHours(), torna = rientroDiQualcuno();
  if (torna) { vai("porta", "seduto", 60000); var m = Math.max(0, Math.round((torna.r.arrivo - Date.now()) / 60000)); dici(m > 1 ? "Arriva " + nome(torna.p) + "! Tra " + m + " min 🚪" : "Arriva " + nome(torna.p) + "! 🚪", 6000); return; }
  if (h >= 23 || h < 7) { vai("cuccia", "dorme", 120000); return; }
  if (tuttiFuori()) { if (Math.random() < .7) vai("cuccia", "dorme", 90000); else vai("finestra", "seduto", 40000); return; }
  var r = Math.random();
  if (CIOT.cibo > 5 && r < .2) vai("cibo", "mangia", 9000);
  else if (CIOT.acqua > 5 && r < .32) vai("acqua", "mangia", 6000);
  else if (r < .5) { vai("finestra", "seduto", 20000); if (Math.random() < .5) setTimeout(function () { if (ST.dove === "finestra") dici(METEO.tipo === "pioggia" ? "Piove… 🌧️" : METEO.tipo === "neve" ? "Nevica! ❄️" : "Che bel cielo ☀️", 4000); }, 4000); }
  else if (r < .7) { ST.fare = "gioca"; ST.fino = Date.now() + 15000; ST.palla.v = (Math.random() < .5 ? -1 : 1) * 6; }
  else if (r < .85) vai("cuccia", "dorme", 30000);
  else vai("centro", "seduto", 15000);
}
function vai(dove, poi, ms) { ST.meta = POSTI[dove]; ST.dove = dove; ST.poi = poi; ST.ms = ms; ST.fare = "va"; }
function passo() {
  ST.f++;
  if (ST.fusa > 0) ST.fusa--;
  if (ST.occhi > 0) ST.occhi--; else if (Math.random() < .012) ST.occhi = 3;   // sbatte le palpebre
  var off = { cibo: -72, acqua: -72 }[ST.dove] || 0;   // a mangiare si mette con la testa sopra la ciotola
  if (ST.fare === "va") {
    var meta = ST.meta + (ST.poi === "mangia" ? off : 0), dx = meta - ST.x;
    if (Math.abs(dx) < 3) { ST.x = meta; ST.fare = ST.poi; ST.posa = ST.poi; ST.fino = Date.now() + ST.ms; if (ST.poi === "mangia") ST.verso = 1; if (ST.dove === "porta") ST.verso = 1; }
    else { ST.verso = dx > 0 ? 1 : -1; ST.x += ST.verso * 2.6; ST.posa = "cammina"; }
  } else if (ST.fare === "gioca") {   // rincorre il gomitolo
    var p = ST.palla; p.x += p.v; p.giro += p.v / 14; p.v *= .985;
    if (p.x < 300 || p.x > 760) { p.v = -p.v; p.x = Math.max(300, Math.min(760, p.x)); }
    if (Math.abs(p.v) < 1 && Math.random() < .03) p.v = (Math.random() < .5 ? -1 : 1) * (4 + Math.random() * 4);
    var dd = p.x - ST.x - ST.verso * 70;
    if (Math.abs(dd) > 8) { ST.verso = dd > 0 ? 1 : -1; ST.x += ST.verso * 3.4; ST.posa = "cammina"; } else ST.posa = "seduto";
    if (Date.now() > ST.fino) scegli();
  } else {
    if (ST.fare === "mangia") { if (ST.dove === "cibo") CIOT.cibo = Math.max(0, CIOT.cibo - .02); else CIOT.acqua = Math.max(0, CIOT.acqua - .03); }
    if (Date.now() > ST.fino) scegli();
  }
}

// ================= fumetti e cuori (in HTML sopra la tela) =================
function testaY() { return ST.posa === "seduto" ? PAV - 175 : ST.posa === "dorme" ? PAV - 90 : PAV - 145; }
function dici(t, ms) { var f = $("fumetto"); f.textContent = t; f.classList.remove("via"); posFumetto(); clearTimeout(dici.t); dici.t = setTimeout(function () { f.classList.add("via"); }, ms || 3500); }
function posFumetto() { var f = $("fumetto"); f.style.left = (OFX + (ST.x + (ST.posa === "cammina" || ST.posa === "mangia" ? ST.verso * 60 : 0)) * SCALA) + "px"; f.style.top = (OFY + testaY() * SCALA) + "px"; }
function cuori(n) {
  for (var i = 0; i < (n || 5); i++) (function (i) { setTimeout(function () {
    var c = document.createElement("span"); c.className = "cuore"; c.textContent = "♥";
    c.style.left = (OFX + (ST.x + (Math.random() * 60 - 30)) * SCALA) + "px"; c.style.top = (OFY + (testaY() + 30) * SCALA) + "px";
    $("scena").appendChild(c); setTimeout(function () { c.remove(); }, 1700);
  }, i * 160); })(i);
}

// ================= tocchi: coccole e ciotole =================
tela.addEventListener("click", function (e) {
  var r = $("scena").getBoundingClientRect(), x = (e.clientX - r.left - OFX) / SCALA, y = (e.clientY - r.top - OFY) / SCALA;
  if (VERT || verso !== "auto") { var sx = e.clientX, sy = e.clientY, w = innerWidth, h = innerHeight, giro = (verso === "dx" || verso === "sx") && h > w ? (verso === "dx" ? 90 : -90) : verso === "vert" && w > h ? 90 : 0;
    if (giro === 90) { x = (sy - OFX) / SCALA; y = (w - sx - OFY) / SCALA; } else if (giro === -90) { x = (h - sy - OFX) / SCALA; y = (sx - OFY) / SCALA; } }
  if (y > PAV - 40 && y < PAV + 12) {
    if (Math.abs(x - POSTI.cibo) < 40) { CIOT.cibo = 100; salva("gatto_stanza", CIOT); dici("Gnam! Grazie 🐟", 2500); return; }
    if (Math.abs(x - POSTI.acqua) < 40) { CIOT.acqua = 100; salva("gatto_stanza", CIOT); dici("Acqua fresca 💧", 2500); return; }
  }
  if (Math.abs(x - ST.x) < 90 && y > testaY() - 20 && y < PAV + 12) {
    if (navigator.vibrate) navigator.vibrate([10, 30, 10, 30, 10]);
    ST.fusa = 120; cuori(5); dici(ST.posa === "dorme" ? "Mmh… prrr" : "Prrr… ♥", 2500);
    if (ST.fare !== "va") ST.fino = Math.max(ST.fino, Date.now() + 5000);
  }
});

// ================= la casa: pensieri, rientri, feste, meteo =================
function controllaCasa() {
  var n = pensieriNuovi("pensieri_visti_gatto");
  if (n.length) { var x = n[n.length - 1]; cuori(8); dici("♥ " + nome(x.da) + " pensa a " + nome(1 - x.da), 6000); }
  var d = new Date(), feste = window.festeDel ? festeDel(d) : [], comp = window.compleanniDel ? compleanniDel(d) : [];
  ST.cappello = !!(feste.some(function (x) { return x.festivo || x.regalo; }) || comp.length);
  if (rientroDiQualcuno() && ST.dove !== "porta") scegli();
  disegnaInfo();
}
function disegnaInfo() {
  var d = new Date(); $("ora").textContent = d.getHours() + ":" + due(d.getMinutes());
  $("noi").innerHTML = [0, 1].map(function (p) {
    var r = rientroDi(p); if (r && Date.now() < r.arrivo) return "<b>" + nome(p) + "</b> arriva alle " + oraHM(r.arrivo);
    var f = fuoriDi(p); if (f) return "<b>" + nome(p) + "</b> è fuori";
    return "<b>" + nome(p) + "</b> " + (statoAdesso(p).stato === "lavoro" ? "al lavoro" : "a casa");
  }).join(" · ");
}
function leggiMeteo() {
  fetch("https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current=weather_code&timezone=Europe%2FRome")
    .then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current.weather_code;
      METEO.tipo = c >= 95 ? "temporale" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "neve" : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? "pioggia" : c === 45 || c === 48 || c === 3 ? "coperto" : c >= 1 ? "nuvoloso" : "sereno";
    }, function () {});
}

// ================= girare lo schermo e inquadrare =================
var verso = leggi("gatto_verso", "auto");
function applicaVerso() {
  var sc = $("scena"), w = innerWidth, h = innerHeight, giro = 0;
  if ((verso === "dx" || verso === "sx") && h > w) giro = verso === "dx" ? 90 : -90;
  if (verso === "vert" && w > h) giro = 90;
  var tr = giro ? (giro > 0 ? "translateX(" + w + "px) rotate(90deg)" : "translateY(" + h + "px) rotate(-90deg)") : "";
  SW = giro ? h : w; SH = giro ? w : h;
  sc.style.width = SW + "px"; sc.style.height = SH + "px"; sc.style.webkitTransform = tr; sc.style.transform = tr;
  VERT = SH > SW * 1.1;
  SCALA = VERT ? Math.min(SW / 400, SH * .66 / LH) : Math.min(SW / LW, SH / LH);   // in verticale: più vicino, e l'inquadratura segue il gatto
  OFY = VERT ? (SH - LH * SCALA) * .6 : (SH - LH * SCALA) / 2;
  OFX = VERT ? segui(true) : (SW - LW * SCALA) / 2;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  tela.width = Math.round(SW * DPR); tela.height = Math.round(SH * DPR); tela.style.width = SW + "px"; tela.style.height = SH + "px";
  rifaiSfondo();
  $("b-ruota").textContent = { auto: "⟳", dx: "▭", sx: "▭", vert: "▯" }[verso];
}
function segui(subito) { var meta = Math.max(SW - LW * SCALA, Math.min(0, SW / 2 - ST.x * SCALA)); return subito ? meta : OFX + (meta - OFX) * .06; }
$("b-ruota").onclick = function (e) { e.stopPropagation(); var l = ["auto", "dx", "sx", "vert"]; verso = l[(l.indexOf(verso) + 1) % l.length]; salva("gatto_verso", verso); applicaVerso(); };
window.addEventListener("resize", applicaVerso);

// ================= via =================
var ultimo = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - ultimo < 40) return; ultimo = t;   // 25 al secondo
  passo();
  if (VERT) { var nx = segui(false); if (Math.abs(nx - OFX) > .5) { OFX = nx; rifaiSfondo(); } }
  disegna(t);
  if (!$("fumetto").classList.contains("via")) posFumetto();
}
function ridisegna() { controllaCasa(); }
function tieniAcceso() { if ("wakeLock" in navigator && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {}); }
document.addEventListener("visibilitychange", tieniAcceso);
document.addEventListener("dblclick", function () { var e = document.documentElement; if (!document.fullscreenElement && e.requestFullscreen) e.requestFullscreen().catch(function () {}); });
(function () {   // le ciotole si sono svuotate un po' mentre la pagina era chiusa
  var ore = (Date.now() - (CIOT.t || Date.now())) / 3600000;
  CIOT.cibo = Math.max(0, CIOT.cibo - ore * 4); CIOT.acqua = Math.max(0, CIOT.acqua - ore * 5); CIOT.t = Date.now();
})();
applicaVerso(); disegnaInfo(); leggiMeteo(); scegli(); tieniAcceso(); requestAnimationFrame(frame);
setInterval(controllaCasa, 5000);
setInterval(function () { CIOT.t = Date.now(); salva("gatto_stanza", CIOT); }, 60000);
setInterval(leggiMeteo, 30 * 60000);
avviaSync();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
