<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Home2Love · La stanza del gatto</title>

<style>
  /* Home2Love — La stanza del gatto: un telefono avanzato appoggiato in casa diventa la casetta del gatto.
     Illustrazione disegnata dal vivo (niente immagini): cuccia, ciotole, gomitolo, lampada, pianta, orologio vero
     e una finestra con il cielo e il tempo veri di Bologna. La luce cambia con l'ora (sole dalla finestra,
     sera calda, notte con la lampada). Il gatto segue la casa: aspetta alla porta chi ha premuto "Sto tornando",
     fa i cuori quando vi pensate, dorme di notte o quando siete fuori, cappellino a feste e compleanni.
     Toccalo per le coccole; tocca le ciotole per riempirle. In alto i giochi: snack, piuma e laser da muovere col dito,
     spazzola, scatola di cartone, foto della stanza e il nome del gatto, che si legge sulla ciotola (condiviso tra i dispositivi). */
  :root { --ink: #fff5ec; --muted: rgba(255,245,236,.7); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d18; color: var(--ink); font-family: Outfit, -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #scena { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  #tela { position: absolute; left: 0; top: 0; cursor: pointer; }
  #fumetto { position: absolute; z-index: 3; background: #fff; color: #2a1d18; border-radius: 3vmin; padding: 1.5vmin 2.6vmin; font: 600 3.3vmin/1.25 Outfit, sans-serif; white-space: nowrap;
             box-shadow: 0 1vmin 3vmin rgba(0,0,0,.25); -webkit-transform: translate(-50%, -100%); transform: translate(-50%, -100%); pointer-events: none; transition: opacity .3s; }
  #fumetto::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -1.4vmin; border: 1.4vmin solid transparent; border-top-color: #fff; }
  #fumetto.via { opacity: 0; }
  #info { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 1.6vmin 3vmin; padding-bottom: max(1.6vmin, env(safe-area-inset-bottom)); display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline;
          background: linear-gradient(transparent, rgba(20,12,10,.6)); font-size: 2.8vmin; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #ora { font-size: 4.6vmin; font-weight: 300; margin-right: 2.4vmin; } #noi { color: var(--muted); -webkit-flex: 1; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #noi b { color: var(--ink); font-weight: 600; }
  #b-ruota { position: absolute; z-index: 4; right: 1.6vmin; top: 1.6vmin; width: 8vmin; height: 8vmin; max-width: 46px; max-height: 46px; border: 0; border-radius: 50%; background: rgba(0,0,0,.18); color: rgba(255,255,255,.65); font-size: 20px; cursor: pointer; }
  #giochi { position: absolute; z-index: 4; left: 1.6vmin; top: 1.6vmin; right: 12vmin; display: -webkit-flex; display: flex; overflow-x: auto; scrollbar-width: none; padding: .4vmin 0 1.2vmin .4vmin; }
  #giochi::-webkit-scrollbar { display: none; }
  #giochi button { flex: none; }
  #felice { color: #ff7d93; letter-spacing: .1em; margin-left: 2vmin; white-space: nowrap; }
  #giochi button { width: 8vmin; height: 8vmin; max-width: 46px; max-height: 46px; min-width: 34px; min-height: 34px; margin-right: 1.2vmin; border: 0; border-radius: 50%;
                   background: rgba(255,255,255,.55); font-size: min(4.2vmin, 22px); line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 .6vmin 1.6vmin rgba(0,0,0,.18); }
  #giochi button.on { background: #ffcf5a; box-shadow: 0 0 0 .6vmin rgba(255,207,90,.45); }
  .cuore { position: absolute; z-index: 3; color: #ff5468; font-size: 4.4vmin; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.2); -webkit-animation: sale 1.6s ease-out forwards; animation: sale 1.6s ease-out forwards; }
  @-webkit-keyframes sale { from { opacity: 1; -webkit-transform: translate(-50%, 0) scale(.8); } to { opacity: 0; -webkit-transform: translate(-50%, -14vmin) scale(1.3); } }
  @keyframes sale { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -14vmin) scale(1.3); } }
</style>
</head>
<body>
<div id="scena">
  <canvas id="tela"></canvas>
  <div id="fumetto" class="via"></div>
  <div id="info"><span id="ora"></span><span id="noi"></span><span id="felice"></span></div>
  <button id="b-ruota" type="button" aria-label="Gira lo schermo">⟳</button>
  <div id="giochi">
    <button type="button" data-g="snack" title="Dagli uno snack">🍗</button>
    <button type="button" data-g="piuma" title="Bacchetta con la piuma: muovila col dito">🪶</button>
    <button type="button" data-g="laser" title="Puntatore laser: muovilo col dito">🔴</button>
    <button type="button" data-g="spazzola" title="Spazzolalo: passa il dito sul gatto">🪮</button>
    <button type="button" data-g="scatola" title="Una scatola di cartone">📦</button>
    <button type="button" data-g="topo" title="Topolino a molla">🐭</button>
    <button type="button" data-g="erba" title="Erba gatta">🌿</button>
    <button type="button" data-g="nanna" title="Ninna nanna">🎶</button>
    <button type="button" data-g="collare" title="Il collare: tocca per cambiare colore">🎀</button>
    <button type="button" data-g="foto" title="Scatta una foto">📸</button>
    <button type="button" data-g="nome" title="Il nome sulla ciotola">✏️</button>
  </div>
</div>

<script>
// ================= la stanza: coordinate "logiche" 1000×600, disegnate a piena risoluzione =================

var ST = { x: 580, verso: 1, meta: 580, fare: "seduto", fino: 0, posa: "seduto", f: 0, palla: { x: 650, v: 0, giro: 0 }, cappello: false, fusa: 0, occhi: 0 };

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, Math.PI * 2); }
function lin(x0, y0, x1, y1, stops) { var gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); }); return gr; }

// ---------------- luce: secondo l'ora
function momento() {
  var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h < 6.5 || h >= 21) return { nome: "notte", buio: .55, caldo: 0, lampada: 1 };
  if (h < 8) return { nome: "alba", buio: .18, caldo: .12, lampada: .3 };
  if (h >= 18.5) return { nome: "sera", buio: .3, caldo: .2, lampada: .85 };
  if (h >= 16.5) return { nome: "tramonto", buio: .06, caldo: .16, lampada: 0 };
  return { nome: "giorno", buio: 0, caldo: 0, lampada: 0 };
}

// ---------------- sfondo: muro, pavimento e mobili (si ridisegna solo quando serve)
var SFONDO = document.createElement("canvas"), sg = null, sfondoMin = -1;
function rifaiSfondo() {
  SFONDO.width = tela.width; SFONDO.height = tela.height; sg = SFONDO.getContext("2d");
  var g0 = g; g = sg; g.setTransform(SCALA * DPR, 0, 0, SCALA * DPR, OFX * DPR, OFY * DPR);
  var x0 = -OFX / SCALA - 10, x1 = (SW - OFX) / SCALA + 10, y0 = -OFY / SCALA - 10, y1 = (SH - OFY) / SCALA + 10;
  // muro con carta da parati
  g.fillStyle = lin(0, y0, 0, MURO, [[0, "#e9d2b6"], [1, "#dcc0a0"]]); g.fillRect(x0, y0, x1 - x0, MURO - y0);

    for (var y = 40; y < MURO - 20; y += 70) { g.fillStyle = "rgba(170,120,90,.18)"; ell(x + 41, y + (x / 60 % 2) * 35, 3.5, 3.5); g.fill(); }
  }

  g.fillStyle = "#f6efe6"; g.fillRect(x0, MURO - 22, x1 - x0, 24); g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(x0, MURO + 1, x1 - x0, 3);
  // parquet
  g.fillStyle = lin(0, MURO, 0, y1, [[0, "#a8714a"], [1, "#7b4c2e"]]); g.fillRect(x0, MURO, x1 - x0, y1 - MURO);
  var righe = [MURO + 2, MURO + 22, MURO + 46, MURO + 74, MURO + 108, MURO + 150, MURO + 200];

    var passo = 90 + i * 30;
    for (var k = Math.floor(x0 / passo) * passo + (i % 2) * passo / 2; k < x1; k += passo) { g.fillRect(k, ry, 1.6, (righe[i + 1] || y1) - ry); g.fillStyle = i % 2 ? "rgba(255,230,200,.05)" : "rgba(60,30,15,.05)"; g.fillRect(k + 2, ry + 2, passo - 4, (righe[i + 1] || y1) - ry - 3); g.fillStyle = "rgba(60,30,15,.28)"; }
  });
  // tappeto
  g.fillStyle = "rgba(0,0,0,.12)"; ell(580, PAV + 22, 210, 26); g.fill();
  g.fillStyle = lin(380, 0, 780, 0, [[0, "#c25b6a"], [.5, "#d9727f"], [1, "#c25b6a"]]); ell(580, PAV + 16, 205, 24); g.fill();
  g.strokeStyle = "rgba(255,235,220,.55)"; g.lineWidth = 3; ell(580, PAV + 16, 180, 18); g.stroke(); g.lineWidth = 1.5; ell(580, PAV + 16, 150, 13); g.stroke();
  // finestra (il vetro lo riempie il cielo vivo: qui resta un buco)

  g.fillStyle = "rgba(0,0,0,.08)"; rr(372, 76, 262, 272, 6); g.fill();
  g.fillStyle = "#fbf6ee"; rr(366, 66, 268, 274, 6); g.fill();
  g.fillStyle = "#e9e0d2"; g.fillRect(366, 330, 268, 10);
  g.save(); g.globalCompositeOperation = "destination-out"; g.fillRect(382, 82, 236, 238); g.restore();
  g.fillStyle = "#fbf6ee"; g.fillRect(496, 82, 8, 238); g.fillRect(382, 196, 236, 8);
  g.fillStyle = "#efe6d8"; rr(350, 338, 300, 16, 4); g.fill(); g.fillStyle = "rgba(0,0,0,.1)"; g.fillRect(356, 354, 288, 4);   // davanzale
  // orologio (le lancette si disegnano ogni minuto)
  var ox = 175, oy = 145; g.fillStyle = "rgba(0,0,0,.12)"; ell(ox + 4, oy + 6, 50, 50); g.fill();
  g.fillStyle = "#7a5038"; ell(ox, oy, 50, 50); g.fill(); g.fillStyle = "#fffaf2"; ell(ox, oy, 43, 43); g.fill();
  for (var t = 0; t < 12; t++) { var a = t / 12 * Math.PI * 2; g.fillStyle = "#7a5038"; g.save(); g.translate(ox + Math.sin(a) * 36, oy - Math.cos(a) * 36); g.rotate(a); g.fillRect(-1.2, -(t % 3 ? 3 : 5), 2.4, t % 3 ? 6 : 10); g.restore(); }
  var d = new Date(), mi = d.getMinutes(), ho = d.getHours() % 12 + mi / 60;
  g.strokeStyle = "#3a2618"; g.lineCap = "round"; g.lineWidth = 4.5; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.sin(ho / 12 * 6.283) * 22, oy - Math.cos(ho / 12 * 6.283) * 22); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.sin(mi / 60 * 6.283) * 33, oy - Math.cos(mi / 60 * 6.283) * 33); g.stroke();
  g.fillStyle = "#d9534f"; ell(ox, oy, 4, 4); g.fill();
  // quadretto
  g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(714, 116, 92, 76); g.fillStyle = "#8a5a3c"; g.fillRect(708, 108, 92, 76); g.fillStyle = "#fbeef0"; g.fillRect(716, 116, 76, 60);
  g.fillStyle = "#ff5468"; g.beginPath(); g.moveTo(754, 162); g.bezierCurveTo(726, 144, 734, 122, 754, 134); g.bezierCurveTo(774, 122, 782, 144, 754, 162); g.fill();
  // porta e zerbino
  g.fillStyle = "rgba(0,0,0,.14)"; g.fillRect(830, 160, 148, MURO - 158); g.fillStyle = "#77492d"; g.fillRect(822, 150, 148, MURO - 150);
  g.fillStyle = "#8c5a38"; g.fillRect(832, 160, 128, MURO - 162);
  [[846, 176, 100, 110], [846, 304, 100, 120]].forEach(function (p) { g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(p[0], p[1], p[2], p[3]); g.fillStyle = "#97633f"; g.fillRect(p[0] + 4, p[1] + 4, p[2] - 8, p[3] - 8); });
  g.fillStyle = "#e7c35c"; ell(948, 300, 7, 7); g.fill(); g.fillStyle = "rgba(255,255,255,.6)"; ell(946, 298, 2.5, 2.5); g.fill();
  g.fillStyle = "rgba(0,0,0,.15)"; rr(802, MURO + 10, 190, 26, 6); g.fill(); g.fillStyle = "#a8364a"; rr(800, MURO + 6, 190, 24, 6); g.fill();
  g.fillStyle = "#f3d9c4"; g.font = "700 14px Outfit, sans-serif"; g.textAlign = "center"; g.fillText("C I A O", 895, MURO + 23);

  g.fillStyle = "#5a4a40"; ell(70, PAV + 2, 34, 8); g.fill(); g.fillRect(66, 200, 8, PAV - 200);

  // pianta
  g.fillStyle = "rgba(0,0,0,.15)"; ell(745, PAV + 8, 44, 9); g.fill();

    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, -18); g.lineTo(0, l[1] + 20); g.stroke(); g.restore();
  });
  g.fillStyle = lin(715, 0, 775, 0, [[0, "#c8693f"], [.5, "#de8252"], [1, "#b85c35"]]); g.beginPath(); g.moveTo(712, PAV - 46); g.lineTo(778, PAV - 46); g.lineTo(768, PAV + 4); g.lineTo(722, PAV + 4); g.closePath(); g.fill();
  g.fillStyle = "#b5552f"; g.fillRect(708, PAV - 52, 74, 10);
  // cuccia
  g.fillStyle = "rgba(0,0,0,.18)"; ell(205, PAV + 10, 108, 16); g.fill();
  g.fillStyle = lin(0, PAV - 40, 0, PAV + 10, [[0, "#d65466"], [1, "#a83447"]]); ell(205, PAV - 8, 104, 30); g.fill();
  g.fillStyle = lin(0, PAV - 30, 0, PAV, [[0, "#f6e3d0"], [1, "#e7cdb4"]]); ell(205, PAV - 16, 80, 17); g.fill();
  g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 2; ell(205, PAV - 8, 96, 25); g.stroke();

}
function tende() {
  [[318, 1], [682, -1]].forEach(function (t) {
    var x = t[0], s = t[1];
    g.fillStyle = lin(x - 36, 0, x + 36, 0, [[0, "#9fb7c9"], [.25, "#c2d5e2"], [.5, "#a5bdcf"], [.75, "#c7d9e5"], [1, "#98b1c4"]]);
    g.beginPath(); g.moveTo(x - 38, 52); g.lineTo(x + 38, 52); g.quadraticCurveTo(x + 32 * s + 6 * s, 230, x + 30 * s, 400); g.lineTo(x - 26 * s, 400); g.quadraticCurveTo(x - 30 * s, 220, x - 38, 52); g.fill();
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 2; for (var k = -20; k <= 20; k += 13) { g.beginPath(); g.moveTo(x + k, 56); g.quadraticCurveTo(x + k + 6 * s, 230, x + k + 4 * s, 396); g.stroke(); }
  });
  g.fillStyle = "#6e5244"; rr(260, 44, 480, 9, 4); g.fill(); g.fillStyle = "#c9a35c"; ell(262, 48, 9, 9); g.fill(); ell(738, 48, 9, 9); g.fill();
}

// ---------------- il cielo nella finestra (vivo)
function cielo(t, m) {
  var h = new Date().getHours() + new Date().getMinutes() / 60, cupo = METEO.tipo === "pioggia" || METEO.tipo === "temporale" || METEO.tipo === "neve" || METEO.tipo === "coperto";
  var c = m.nome === "notte" ? ["#0b1230", "#1d2752"] : m.nome === "sera" ? ["#26305e", "#9a5a72"] : m.nome === "tramonto" ? ["#4f6aa8", "#f2a46e"] : m.nome === "alba" ? ["#7b8cc8", "#f6c08c"] : ["#5aa0e6", "#bfe0f6"];
  if (cupo) c = m.nome === "notte" || m.nome === "sera" ? ["#141a26", "#252c3a"] : ["#8a97a8", "#bcc5cf"];
  g.save(); g.beginPath(); g.rect(382, 82, 236, 238); g.clip();
  g.fillStyle = lin(0, 82, 0, 320, [[0, c[0]], [1, c[1]]]); g.fillRect(382, 82, 236, 238);
  if (m.nome === "notte" || m.nome === "sera") {
    if (!cupo) STELLE.forEach(function (s) { g.fillStyle = "rgba(255,255,255," + (.3 + .6 * Math.abs(Math.sin(t / 900 + s.f))).toFixed(2) + ")"; ell(382 + s.x * 236, 82 + s.y * 238, .8 + s.r, .8 + s.r); g.fill(); });
    if (!cupo) { g.fillStyle = rad(560, 125, 0, 40, [[0, "rgba(255,250,230,.35)"], [1, "rgba(255,250,230,0)"]]); g.fillRect(500, 70, 120, 120); g.fillStyle = "#f6f1dc"; ell(560, 125, 14, 14); g.fill(); g.fillStyle = c[0]; ell(566, 121, 12, 12); g.fill(); }
  } else if (!cupo) {
    var sy = m.nome === "giorno" ? 120 : 220; g.fillStyle = rad(560, sy, 0, 70, [[0, "rgba(255,240,190,.75)"], [1, "rgba(255,240,190,0)"]]); g.fillRect(480, sy - 80, 160, 160);
    g.fillStyle = "#fff4cf"; ell(560, sy, 17, 17); g.fill();
  }
  if (METEO.tipo !== "sereno") NUVOLE.forEach(function (n, i) {   // nuvole morbide che passano
    var nx = 382 + ((n.x * 300 + t / 120 * (.4 + i * .1)) % 340) - 50, ny = 82 + n.y * 238, s = n.s * 26, col = cupo ? "rgba(225,230,236,.75)" : "rgba(255,255,255,.88)";
    g.fillStyle = col; [[0, 0, 1], [1, -.35, .8], [1.9, 0, .9], [.9, .25, .9]].forEach(function (b) { ell(nx + b[0] * s, ny + b[1] * s, s * b[2], s * b[2] * .8); g.fill(); });

function vai(dove, poi, ms) { ST.meta = POSTI[dove]; ST.dove = dove; ST.poi = poi; ST.ms = ms; ST.fare = "va"; }

// ================= fumetti e cuori (in HTML sopra la tela) =================
function testaY() { return ST.posa === "seduto" ? PAV - 175 : ST.posa === "dorme" ? PAV - 90 : PAV - 145; }

    $("scena").appendChild(c); setTimeout(function () { c.remove(); }, 1700);

// ================= tocchi: coccole e ciotole =================
function logico(e) {   // dal tocco sullo schermo alle coordinate della stanza

});

  }

    salvaGatto("gatto.collare", col ? { colore: col, t: ora } : null);

// ================= la casa: pensieri, rientri, feste, meteo =================

}
function disegnaInfo() {

  $("noi").innerHTML = [0, 1].map(function (p) {

}
function leggiMeteo() {

    .then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current.weather_code;
      METEO.tipo = c >= 95 ? "temporale" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "neve" : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? "pioggia" : c === 45 || c === 48 || c === 3 ? "coperto" : c >= 1 ? "nuvoloso" : "sereno";
    }, function () {});
}

// ================= girare lo schermo e inquadrare =================
var verso = leggi("gatto_verso", "auto");
function applicaVerso() {
  var sc = $("scena"), w = innerWidth, h = innerHeight, giro = 0;

  OFX = VERT ? segui(true) : (SW - LW * SCALA) / 2;

}

$("b-ruota").onclick = function (e) { e.stopPropagation(); var l = ["auto", "dx", "sx", "vert"]; verso = l[(l.indexOf(verso) + 1) % l.length]; salva("gatto_verso", verso); applicaVerso(); };
window.addEventListener("resize", applicaVerso);

// ================= via =================
var ultimo = 0;

}

(function () {   // le ciotole si sono svuotate un po' mentre la pagina era chiusa
  var ore = (Date.now() - (CIOT.t || Date.now())) / 3600000;
  CIOT.cibo = Math.max(0, CIOT.cibo - ore * 4); CIOT.acqua = Math.max(0, CIOT.acqua - ore * 5); CIOT.t = Date.now();
})();
applicaVerso(); disegnaInfo(); leggiMeteo(); scegli(); tieniAcceso(); requestAnimationFrame(frame);
setInterval(controllaCasa, 5000);
disegnaFelicita();
setInterval(function () {
  felice(-.25);   // circa 3 cuori di meno ogni ora, se nessuno lo considera
  var h = new Date().getHours();
  if (FEL.v < 30 && h >= 8 && h < 22 && Math.random() < .25 && ST.posa !== "dorme") dici((nomeGatto() || "Il gatto") + " si annoia… giochi con me? 🥺", 4000);
}, 5 * 60000);
setInterval(function () { CIOT.t = Date.now(); salva("gatto_stanza", CIOT); }, 60000);
setInterval(leggiMeteo, 30 * 60000);
var DENTRO = window.parent !== window;   // dentro il telefono (scheda Gatto): i dati li sincronizza il telefono, qui si leggono e basta
if (DENTRO) {
  document.documentElement.classList.add("dentro");
  salvaCfg = function () {};
  setInterval(function () { Object.assign(cfg, leggi("cucina_cfg", {})); reg = leggi("cucina_registro", reg) || {}; }, 5000);
} else {
  avviaSync();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
}
