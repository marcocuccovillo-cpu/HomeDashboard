# Home2Love — aggiorna il palinsesto TV ogni 6 ore e lo mette nel ramo "palinsesto"
# (un solo file, palinsesto.json, letto da tv.html). Ne mette una copia anche nel sito (ramo principale):
# serve ai dispositivi vecchi (l'iPad con iOS 9) che raggiungono solo github.io.
name: Palinsesto TV
on:
  schedule:
    - cron: "23 3,9,15,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica il palinsesto
        run: python3 strumenti/palinsesto.py /tmp/palinsesto.json
      - name: Pubblica nel ramo palinsesto
        run: |
          mkdir /tmp/ramo && cd /tmp/ramo
          git init -q -b palinsesto
          cp /tmp/palinsesto.json .
          git add palinsesto.json
          git -c user.name="palinsesto" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Palinsesto TV $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" palinsesto
      - name: Copia nel sito (per i dispositivi vecchi)
        run: |
          cp /tmp/palinsesto.json palinsesto.json
          git add palinsesto.json
          git -c user.name="palinsesto" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Palinsesto TV (copia per il sito)" || exit 0
          for prova in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((prova * 10))
          done
          exit 1
