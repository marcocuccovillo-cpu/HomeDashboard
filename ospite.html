<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12141b">
<title>Home2Love · Party</title>
<link rel="icon" href="icone/icona.svg" type="image/svg+xml">
<style>
  /* Pagina per gli ospiti della festa: si apre dal QR della console, senza password e senza nessun dato di casa. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(circle at 50% 0%, #2b2f3d, #12141b 70%); color: #eef1f8; font: 16px/1.4 -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); overscroll-behavior: none; }
  h1 { font: 800 22px/1.1 ui-monospace, Menlo, monospace; letter-spacing: .04em; margin: 18px 0 4px; }
  h1 span { color: #ff3b5c; }
  .sotto { color: #9aa3b8; font-size: 14px; margin: 0 0 18px; }
  .card { background: #1f2330; border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 30px -14px rgba(0,0,0,.7); }
  input { width: 100%; padding: 14px; border-radius: 14px; border: 0; background: #2c3142; color: #fff; font-size: 18px; outline: none; }
  button { font: inherit; cursor: pointer; }
  .grosso { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 700; background: #ff3b5c; color: #fff; margin-top: 10px; }
  .grosso:disabled { opacity: .5; }
  #stato { color: #ffd75e; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .parola { font: 800 30px/1.1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-align: center; margin: 4px 0 10px; text-transform: uppercase; }
  .lettere { font: 700 24px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .3em; text-align: center; color: #9aa3b8; margin: 4px 0 12px; }
  #tela { width: 100%; aspect-ratio: 4 / 3; background: #0b0d13; border-radius: 14px; touch-action: none; display: block; box-shadow: inset 0 0 0 2px #2c3142; }
  .attrezzi { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .attrezzi .col { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .attrezzi .col.sel { border-color: #fff; }
  .attrezzi .sp { margin-left: auto; border: 0; border-radius: 10px; padding: 8px 12px; background: #2c3142; color: #fff; }
  .attrezzi .dim { border: 0; border-radius: 10px; padding: 8px 10px; background: #2c3142; color: #fff; }
  .attrezzi .dim.sel { background: #fff; color: #12141b; }
  .riga { display: flex; gap: 8px; }
  .riga input { flex: 1; }
  .riga button { border: 0; border-radius: 14px; padding: 0 18px; background: #ff3b5c; color: #fff; font-weight: 700; }
  #esito { text-align: center; font-weight: 700; min-height: 24px; margin-top: 10px; }
  .classifica div { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #2c3142; }
  .classifica div:first-child { border-top: 0; }
  .classifica i { width: 12px; height: 12px; border-radius: 50%; }
  .classifica span { flex: 1; } .classifica b { font-variant-numeric: tabular-nums; }
  .centro { text-align: center; }
  .emoji { font-size: 54px; line-height: 1.1; }
</style>
</head>
<body>
<h1>HOME<span>2</span>LOVE · PARTY</h1>
<p class="sotto">Disegna e indovina: lo schermo è il tablet di casa.</p>

<div class="card" id="v-entra">
  <label for="nome" class="sotto" style="display:block;margin:0 0 8px">Come ti chiami?</label>
  <input id="nome" maxlength="16" autocomplete="off" placeholder="Il tuo nome" enterkeyhint="go">
  <button class="grosso" id="entra">Entra nella partita</button>
  <div id="stato"></div>
</div>

<div id="v-gioco" hidden>
  <div class="card" id="v-attesa"><div class="centro"><div class="emoji">🎉</div><b id="att-titolo">Sei dentro!</b><p class="sotto" id="att-testo" style="margin:6px 0 0">Aspetta che si inizi dal tablet.</p></div></div>
  <div class="card" id="v-disegna" hidden>
    <div class="sotto centro" style="margin:0">Tocca a te: disegna</div>
    <div class="parola" id="d-parola"></div>
    <canvas id="tela"></canvas>
    <div class="attrezzi" id="colori"></div>
  </div>
  <div class="card" id="v-indovina" hidden>
    <div class="sotto centro" style="margin:0" id="i-chi"></div>
    <div class="lettere" id="i-lettere"></div>
    <form class="riga" id="i-form"><input id="i-testo" autocomplete="off" placeholder="Cos'è?" enterkeyhint="send"><button>Prova</button></form>
    <div id="esito"></div>
  </div>
  <div class="card classifica" id="v-classifica"></div>
</div>

<script>
var q = {}; location.hash.slice(1).split("&").forEach(function (x) { var p = x.split("="); q[p[0]] = decodeURIComponent(p[1] || ""); });
var NTFY = window.NTFY_BASE || "https://ntfy.sh/", STUN = [{ urls: "stun:stun.l.google.com:19302" }];
var io = { id: Math.random().toString(36).slice(2, 10), nome: "", chiave: null, pc: null, dc: null, es: null, stato: null };
function $(id) { return document.getElementById(id); }
function stato(t) { $("stato").textContent = t; }
function daB64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function b64u(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function cifra(o) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, io.chiave, new TextEncoder().encode(JSON.stringify(o))).then(function (c) {
    var t = new Uint8Array(12 + c.byteLength); t.set(iv); t.set(new Uint8Array(c), 12); return b64u(t);
  });
}
function decifra(s) {
  var b = daB64u(s);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, io.chiave, b.slice(12)).then(function (p) { return JSON.parse(new TextDecoder().decode(p)); });
}
function pubblica(o) { return cifra(o).then(function (c) { return fetch(NTFY + q.s, { method: "POST", body: c }); }); }
function attendiIce(pc) {
  return new Promise(function (ok) {
    if (pc.iceGatheringState === "complete") return ok();
    var t = setTimeout(ok, 3000);
    pc.addEventListener("icegatheringstatechange", function () { if (pc.iceGatheringState === "complete") { clearTimeout(t); ok(); } });
  });
}
if (!q.s || !q.k) { stato("Link incompleto: inquadra di nuovo il QR sul tablet."); $("entra").disabled = true; }
else crypto.subtle.importKey("raw", daB64u(q.k), "AES-GCM", false, ["encrypt", "decrypt"]).then(function (k) { io.chiave = k; });
try { $("nome").value = localStorage.getItem("party_nome") || ""; } catch (e) {}

$("entra").onclick = function () {
  var n = $("nome").value.trim(); if (!n) { $("nome").focus(); return; }
  if (!io.chiave) return;
  io.nome = n; try { localStorage.setItem("party_nome", n); } catch (e) {}
  this.disabled = true; stato("Busso al tablet…");
  io.es = new EventSource(NTFY + q.s + "/sse");
  io.es.onopen = function () { pubblica({ tipo: "ciao", id: io.id, nome: n }); };
  io.es.onmessage = function (e) {
    var m; try { m = JSON.parse(e.data); } catch (er) { return; }
    if (!m.message) return;
    decifra(m.message).then(function (x) { if (x.tipo === "offerta" && x.id === io.id && !io.pc) rispondi(x.sdp); }, function () {});
  };
  setTimeout(function () { if (!io.dc || io.dc.readyState !== "open") { stato("Il tablet non risponde: è aperto sulla console? Riprova."); $("entra").disabled = false; } }, 30000);
};
function rispondi(sdp) {
  stato("Mi collego…");
  var pc = new RTCPeerConnection({ iceServers: STUN }); io.pc = pc;
  pc.ondatachannel = function (e) {
    io.dc = e.channel;
    io.dc.onopen = function () { if (io.es) io.es.close(); $("v-entra").hidden = true; $("v-gioco").hidden = false; if (navigator.vibrate) navigator.vibrate([40, 60, 40]); };
    io.dc.onclose = function () { $("v-entra").hidden = false; $("v-gioco").hidden = true; stato("Scollegato dal tablet."); $("entra").disabled = false; io.pc = null; };
    io.dc.onmessage = function (m) { messaggio(JSON.parse(m.data)); };
  };
  pc.onconnectionstatechange = function () { if (pc.connectionState === "failed") stato("Collegamento non riuscito: sei sul Wi‑Fi di casa (non quello ospiti)?"); };
  pc.setRemoteDescription({ type: "offer", sdp: sdp }).then(function () { return pc.createAnswer(); })
    .then(function (a) { return pc.setLocalDescription(a); }).then(function () { return attendiIce(pc); })
    .then(function () { return pubblica({ tipo: "risposta", id: io.id, sdp: pc.localDescription.sdp }); })
    .catch(function () { stato("Collegamento non riuscito, riprova."); });
}
function manda(o) { if (io.dc && io.dc.readyState === "open") io.dc.send(JSON.stringify(o)); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function messaggio(m) {
  if (m.t === "esito") {
    $("esito").textContent = m.ok ? "Giusto! 🎉" : m.quasi ? "Ci sei quasi!" : "";
    $("esito").style.color = m.ok ? "#7dff9a" : "#ffd75e";
    if (m.ok && navigator.vibrate) navigator.vibrate([60, 40, 120]);
    return;
  }
  if (m.t !== "stato") return;
  var prima = io.stato; io.stato = m;
  $("v-disegna").hidden = !m.disegna;
  $("v-indovina").hidden = !(m.fase === "turno" && !m.disegna);
  $("v-attesa").hidden = m.fase === "turno";
  if (m.disegna) {
    $("d-parola").textContent = m.parola;
    if (!prima || !prima.disegna) { preparaTela(); if (navigator.vibrate) navigator.vibrate(200); }
  }
  if (m.fase === "turno" && !m.disegna) {
    $("i-chi").textContent = "Disegna " + m.chi + "!";
    $("i-lettere").textContent = m.lettere.split("").join("");
    $("i-form").hidden = m.indovinato;
    if (m.indovinato) $("esito").textContent = "Hai indovinato! Aspetta gli altri.";
    else if (!prima || prima.fase !== "turno" || prima.chi !== m.chi) { $("esito").textContent = ""; $("i-testo").value = ""; }
  }
  $("att-titolo").textContent = m.fase === "svela" ? "Era: " + m.parola.toUpperCase() : m.fase === "classifica" ? "Partita finita!" : "Sei dentro, " + m.nome + "!";
  $("att-testo").textContent = m.fase === "svela" ? "Prossimo turno tra poco…" : m.fase === "classifica" ? "Guarda il tablet per il vincitore." : "Aspetta che si inizi dal tablet.";
  $("v-classifica").innerHTML = "<b>Classifica</b>" + m.classifica.map(function (g) {
    return '<div><i style="background:' + g.colore + '"></i><span>' + esc(g.nome) + "</span><b>" + g.punti + "</b></div>";
  }).join("");
}
$("i-form").onsubmit = function (e) {
  e.preventDefault(); var t = $("i-testo").value.trim(); if (!t) return;
  manda({ t: "prova", testo: t }); $("i-testo").value = ""; $("esito").textContent = "";
};

// ---------------------------------------------------------------- lavagna di chi disegna
var COLORI = ["#ffffff", "#ff3b5c", "#ffd75e", "#7dff9a", "#3de0d2", "#5db8ff", "#9b7bff", "#ff8a3d", "#0b0d13"];
var penna = { col: "#ffffff", w: .012 }, tratto = null, invio = null;
(function () {
  var box = $("colori");
  COLORI.forEach(function (c, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "col" + (i ? "" : " sel"); b.style.background = c;
    b.title = i === COLORI.length - 1 ? "gomma" : c;
    b.onclick = function () { penna.col = c; [].forEach.call(box.querySelectorAll(".col"), function (x) { x.classList.toggle("sel", x === b); }); };
    box.appendChild(b);
  });
  [[.008, "fine"], [.018, "grosso"]].forEach(function (d, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "dim" + (i ? "" : " sel"); b.textContent = d[1];
    b.onclick = function () { penna.w = d[0]; [].forEach.call(box.querySelectorAll(".dim"), function (x) { x.classList.toggle("sel", x === b); }); };
    box.appendChild(b);
  });
  var p = document.createElement("button"); p.type = "button"; p.className = "sp"; p.textContent = "Cancella tutto";
  p.onclick = function () { var c = $("tela"); c.getContext("2d").clearRect(0, 0, c.width, c.height); manda({ t: "pulisci" }); };
  box.appendChild(p);
})();
function preparaTela() {
  var c = $("tela"), r = c.getBoundingClientRect();
  c.width = Math.round(r.width * devicePixelRatio); c.height = Math.round(r.height * devicePixelRatio);
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
}
function punto(e) { var r = $("tela").getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))]; }
function disegnaLocale(a, b) {
  var c = $("tela"), g = c.getContext("2d"); g.strokeStyle = penna.col; g.lineWidth = penna.w * c.width; g.lineCap = g.lineJoin = "round";
  g.beginPath(); g.moveTo(a[0] * c.width, a[1] * c.height); g.lineTo(b[0] * c.width, b[1] * c.height); g.stroke();
}
function svuota() {   // manda i punti accumulati (ogni ~40 ms), ripartendo dall'ultimo per non lasciare buchi
  if (tratto && tratto.length > 1) { manda({ t: "tratto", p: tratto.map(function (x) { return [+x[0].toFixed(4), +x[1].toFixed(4)]; }), col: penna.col, w: penna.w }); tratto = [tratto[tratto.length - 1]]; }
}
$("tela").addEventListener("pointerdown", function (e) {
  e.preventDefault(); this.setPointerCapture(e.pointerId);
  var p = punto(e); tratto = [p, [p[0] + .0005, p[1]]]; disegnaLocale(p, tratto[1]);
  clearInterval(invio); invio = setInterval(svuota, 40);
});
$("tela").addEventListener("pointermove", function (e) {
  if (!tratto) return;
  var p = punto(e), u = tratto[tratto.length - 1]; disegnaLocale(u, p); tratto.push(p);
});
["pointerup", "pointercancel"].forEach(function (ev) { $("tela").addEventListener(ev, function () { svuota(); tratto = null; clearInterval(invio); }); });
</script>
</body>
</html>
