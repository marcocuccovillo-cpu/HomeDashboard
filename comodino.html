  :root { --ink: #f3ece6; --muted: rgba(243,236,230,.6); --soft: rgba(255,255,255,.07); --line: rgba(255,255,255,.1); --accent: #ff5468;
          --p0: #ff9a62; --p1: #52d1c6; --c1: #05060d; --c2: #0b1026; --glow: rgba(90,110,255,.10); }

  body.notte #fondo { opacity: .3; } body.buio #fondo { opacity: 0; }

         padding: calc(5vmin + env(safe-area-inset-top)) calc(5vmin + env(safe-area-inset-right)) calc(5vmin + env(safe-area-inset-bottom)) calc(5vmin + env(safe-area-inset-left));

              font-size: calc(min(3.5vw, 4.4vh) * var(--k, 1)); padding-left: 4vmin; border-left: 1px solid var(--line); }

  #suona .tasti { display: flex; gap: 4vmin; }

  #chi button { border: 0; border-radius: 14px; padding: 14px 30px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 600; margin: 0 6px; }

<script>
// ================= chi dorme qui =================
var io = leggi("telefono_io", null);

  var box = $("chi-pulsanti"); box.innerHTML = "";
  [0, 1].forEach(function (p) { var b = el("button"); b.type = "button"; b.textContent = cfg.nomi[p].split(" ")[0]; b.onclick = function () { io = p; salva("telefono_io", p); $("chi").classList.remove("on"); pianificata = prossimaSveglia(); disegna(); }; box.appendChild(b); });
  $("chi").classList.add("on");

function nome(p) { return (cfg.nomi[p] || "").split(" ")[0]; }
function hm(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; return Math.floor(min / 60) + ":" + due(min % 60); }
function minDi(d) { return d.getHours() * 60 + d.getMinutes(); }

// ================= sole: alba e tramonto a Bologna (formula NOAA semplificata) =================
function sole(d) {
  var rad = Math.PI / 180, n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  var g = 2 * Math.PI / 365 * (n - 1), eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
  var dec = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g);
  var ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(LAT * rad) * Math.cos(dec)) - Math.tan(LAT * rad) * Math.tan(dec)) / rad;
  var off = -d.getTimezoneOffset();

var FASI = {   // [sopra, sotto, bagliore]
  notte: ["#05060d", "#0b1026", "rgba(90,110,255,.10)"], alba: ["#1b1430", "#5a2d4a", "rgba(255,140,90,.28)"],
  giorno: ["#16202e", "#24364d", "rgba(140,190,255,.14)"], sera: ["#160f26", "#3a1838", "rgba(255,90,120,.20)"]

var STELLE = []; for (var i = 0; i < 90; i++) STELLE.push([Math.random(), Math.random() * .75, Math.random() * 1.2 + .3, Math.random() * 6]);

  var g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);

  });
}

}

// ================= sveglia =================
var SV = leggi("comodino_sveglia", {}); SV = Object.assign({ modo: "spenta", ora: "07:00", anticipo: 90, giorni: "tutti", suono: "carillon", alba: 10 }, SV);
var STAZIONI = [["Radio Deejay", "Radio Deejay"], ["Virgin Radio", "Virgin Radio Italy"], ["RTL 102.5", "RTL 102.5"], ["Radio 105", "Radio 105"], ["Radio Capital", "Radio Capital"], ["Rai Radio 2", "Rai Radio 2"], ["Radio Italia", "Radio Italia"], ["m2o", "m2o"]];
function salvaSV() { salva("comodino_sveglia", SV); pianificata = prossimaSveglia(); disegnaImp(); disegna(); }
function prossimaSveglia() {
  var ora = new Date(), oggi = new Date(ora.getFullYear(), ora.getMonth(), ora.getDate());
  if (SV.modo === "spenta") return null;
  for (var g = 0; g <= 8; g++) {
    var d = piuGiorni(oggi, g), q;
    if (SV.modo === "fissa") {
      if (SV.giorni === "feriali" && (d.getDay() === 0 || d.getDay() === 6)) continue;
      var p = SV.ora.split(":"); q = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +p[0], +p[1]);
      if (q > ora) return { quando: q, perche: "" };
    } else {
      if (io === null) return null;
      var f = fasceGiorno(d, io); if (!f.length) continue;
      q = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, f[0][0] - SV.anticipo);
      if (q > ora) return { quando: q, perche: "turno alle " + hm(f[0][0]) };
    }

var suonando = null, pianificata = null, rimandata = null;
// la sveglia programmata resta ferma finché non suona: passata la sua ora non "salta" al giorno dopo
function controllaSveglia() {
  if (suonando) return;
  var ora = Date.now(), fatte = leggi("comodino_suonate", {});
  var s = rimandata && ora >= rimandata.quando.getTime() ? rimandata : pianificata;
  if (s && ora >= s.quando.getTime() - 500) {
    var k = s.quando.getTime();
    if (s === rimandata) rimandata = null; else pianificata = null;

  if (sv) { var ore = (sv.quando - d) / 3600e3; nr.push("⏰ " + hm(minDi(sv.quando)) + (ore < 14 ? " · " + Math.floor(ore) + " h " + due(Math.round((ore % 1) * 60) % 60) + " di sonno" : "")); }
  else nr.push("nessuna sveglia");
  if (dm) nr.push(dm.testo);
  if (io !== null) { var lui = doveAdesso(1 - io); if (lui) nr.push(nome(1 - io) + ": " + lui); }
  if (suaB && Date.now() - suaB.t < 6 * 3600e3) nr.push("🌙 " + nome(1 - io) + " ti ha dato la buonanotte alle " + hm(minDi(new Date(suaB.t))));
  ni.innerHTML = ""; nr.forEach(function (t) { var x = el("div"); x.textContent = t; ni.appendChild(x); });
  adattaRiquadri();
  // l'insieme si sposta di poco ogni minuto (lo schermo non si "segna")
  $("pag").style.transform = "translate(" + ((m * 7) % 11 - 5) * .25 + "vmin," + ((m * 5) % 9 - 4) * .25 + "vmin)";
}
function mostraStatoSync() {   // dopo ogni sincronizzazione: un "Pensavo a te" per me?
  if (io === null) return;
  var n = pensieriNuovi("pensieri_visti_comodino", 1 - io); if (!n.length) return;
  $("cuore-testo").textContent = nome(1 - io) + " sta pensando a te";
  $("cuore").classList.add("on");
  if (!document.body.classList.contains("notte") && window.suonaPensiero) suonaPensiero();   // di notte solo il cuore
  clearTimeout(mostraStatoSync.t); mostraStatoSync.t = setTimeout(function () { $("cuore").classList.remove("on"); }, 20000);
}

function ridisegna() { if (!pianificata || pianificata.quando.getTime() > Date.now() + 2000) pianificata = prossimaSveglia(); disegna(); }   // mai spostare una sveglia che sta per suonare
function dopoSblocco() { if (io === null) chiediChi(); }

// ================= avvio =================
applicaFase(); applicaLuce(); controllaSveglia(); disegna(); leggiMeteo(); applicaVerso();
setInterval(function () { controllaSveglia(); applicaLuce(); if (new Date().getSeconds() % 15 === 0) disegna(); else disegnaOra(); }, 1000);
setInterval(applicaFase, 60000);
setInterval(leggiMeteo, 30 * 60000);
PAESAGGIO.avvia({ tela: $("paesaggio"), scena: $("fondo"), ms: 66,   // 15 al secondo: è uno sfondo, e il telefono resta acceso tutta la notte
  attivo: function () { var b = document.body.classList; if (b.contains("buio")) return false; if (b.contains("notte")) return Date.now() - (PAESAGGIO.ultimaNotte || 0) > 1000 ? (PAESAGGIO.ultimaNotte = Date.now(), true) : false; return true; } });
tieniAcceso();
avviaSync();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
