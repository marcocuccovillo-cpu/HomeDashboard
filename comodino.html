<script>
// ================= chi dorme qui =================

  }

var rimandata = 0;

  $("suona-perche").textContent = "Buongiorno" + (io !== null ? " " + cfg.nomi[io].split(" ")[0] : "") + "!" + (s.perche ? " · " + s.perche : "");

}
function suonaCarillon() {   // carillon dolce che si ripete e cresce piano per un minuto e mezzo
  if (!suonando) return;
  var ac = audioCtx(); if (!ac) return;
  var passati = (Date.now() - suonando.inizio) / 1000, vol = Math.min(1, .15 + passati / 90), out = ac.createGain(), t = ac.currentTime + .05;
  out.gain.value = vol * .9; out.connect(ac.destination);

}
function fermaSveglia() { if (suonando) clearTimeout(suonando.t); suonando = null; $("suona").classList.remove("on"); }
$("basta").onclick = function () { fermaSveglia(); disegna(); };

  disegna();
}
function ridisegna() { disegna(); }
