<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c0e">
<title>Home2Love · Salotto</title>
<link rel="manifest" href="salotto.webmanifest">
<link rel="icon" href="icone/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salotto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  /* Home2Love — Salotto: per un dispositivo accanto alla TV, da leggere dal divano.
     Le vostre foto al centro, le informazioni intorno come una cornice; sopra a tutto il meteo animato
     (pioggia, neve, nebbia, lampi, nuvole, sole o stelle, dal meteo vero). Pulsante ⟳ per girare lo schermo
     anche con la rotazione automatica spenta. Scritto per funzionare anche su Safari vecchi (iPad). */
  :root { --ink: #fff7f2; --muted: rgba(255,247,242,.62); --p0: #ff9a62; --p1: #52d1c6; --accent: #ff5468; --bg: #120c0e; --card: #1f171a; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Outfit, -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #scena { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  #sfondo { position: absolute; top: -40px; left: -40px; right: -40px; bottom: -40px; background: #2a1418 center / cover no-repeat; -webkit-filter: blur(32px) brightness(.36) saturate(1.2); filter: blur(32px) brightness(.36) saturate(1.2); }
  #cornice { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 3vmin; display: grid; transition: opacity 2s; }
  body.notte #cornice { opacity: .55; }
  /* orizzontale: in alto ora e meteo, ai lati le informazioni, al centro la foto */
  body.oriz #cornice { grid-template-columns: 26% 1fr 26%; grid-template-rows: auto 1fr; grid-template-areas: "ora ora meteo" "noi foto arrivo"; grid-column-gap: 3vmin; grid-row-gap: 2.4vmin; }
  /* verticale: ora e meteo sopra, la foto al centro, le informazioni sotto */
  body.vert #cornice { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "ora meteo" "foto foto" "noi arrivo"; grid-column-gap: 3vmin; grid-row-gap: 2.4vmin; }
  #c-ora { grid-area: ora; } #c-meteo { grid-area: meteo; } #c-noi { grid-area: noi; } #c-arrivo { grid-area: arrivo; } #foto { grid-area: foto; }
  #c-ora { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  #ora { font-size: 12vmin; font-weight: 200; line-height: .95; letter-spacing: -.03em; margin-right: 2.4vmin; }
  #data { font-size: 3.2vmin; color: var(--muted); text-transform: capitalize; }
  #c-meteo { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: flex-end; justify-content: flex-end; }
  #c-meteo .ic { font-size: 7vmin; margin-right: 1.6vmin; } #c-meteo .gr { font-size: 7vmin; font-weight: 200; margin-right: 2vmin; }
  #c-meteo .tx { font-size: 2.6vmin; line-height: 1.35; color: var(--muted); } #c-meteo .tx b { color: var(--ink); font-weight: 400; }
  /* la foto */
  #foto { position: relative; border-radius: 3vmin; overflow: hidden; background: rgba(0,0,0,.28); box-shadow: 0 3vmin 8vmin rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); min-height: 0; }
  #foto img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s ease; }
  #foto img.on { opacity: 1; }
  #foto .vuoto { position: absolute; top: 50%; left: 0; right: 0; text-align: center; -webkit-transform: translateY(-50%); transform: translateY(-50%); font-size: 2.8vmin; color: var(--muted); padding: 0 6vmin; }
  /* informazioni ai lati */
  .lato { min-width: 0; min-height: 0; overflow: hidden; }
  .blocco { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 2.4vmin; padding: 1.6vmin 2vmin; margin-bottom: 1.8vmin; }
  .tit { font-size: 1.8vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .8vmin; }
  .persona { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; padding: .6vmin 0; }
  .persona .av { width: 4.6vmin; height: 4.6vmin; border-radius: 50%; text-align: center; line-height: 4.6vmin; font-weight: 600; font-size: 2.4vmin; margin-right: 1.6vmin; -webkit-flex: none; flex: none; color: #1a120c; }
  .persona.p0 .av { background: var(--p0); } .persona.p1 .av { background: var(--p1); }
  .persona .tx { font-size: 2.5vmin; line-height: 1.3; min-width: 0; }
  .persona .tx b { display: block; font-weight: 600; } .persona .tx span { color: var(--muted); } .persona .tx em { font-style: normal; color: var(--ink); }
  .riga { font-size: 2.5vmin; padding: .45vmin 0; line-height: 1.3; }
  .riga .q { color: var(--muted); display: block; font-size: 2.1vmin; }
  #b-ruota { position: absolute; z-index: 5; right: 1.6vmin; bottom: 1.6vmin; width: 8vmin; height: 8vmin; max-width: 48px; max-height: 48px; border: 0; border-radius: 50%; background: rgba(0,0,0,.25); color: rgba(255,255,255,.5); font-size: 22px; cursor: pointer; }
  #meteo-anim { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<div id="scena">
  <div id="sfondo"></div>
  <div id="cornice">
    <div id="c-ora"><div id="ora">–</div><div id="data"></div></div>
    <div id="c-meteo"><span class="ic">·</span><span class="gr">–</span><span class="tx">carico il meteo…</span></div>
    <div class="lato" id="c-noi"><div class="blocco"><div class="tit">Noi</div><div id="noi"></div></div><div class="blocco"><div class="tit" id="domani-tit">Domani</div><div id="domani"></div></div></div>
    <div id="foto"><img alt=""><img alt=""><div class="vuoto" id="foto-vuoto">Le vostre foto compariranno qui (si aggiungono dalla scheda Foto del telefono).</div></div>
    <div class="lato" id="c-arrivo"><div class="blocco"><div class="tit">In arrivo</div><div id="arrivo"></div></div></div>
  </div>
  <canvas id="meteo-anim"></canvas>
  <button id="b-ruota" type="button" aria-label="Gira lo schermo">⟳</button>
</div>

<script src="comune.js?v=81"></script>
<script src="telecomando.js?v=81"></script>
<script src="compleanni.js?v=81"></script>
<script>
// ================= ora e data =================
function nome(p) { return (cfg.nomi[p] || (p ? "Lei" : "Lui")).split(" ")[0]; }
function testoSicuro(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function disegnaOra() {
  var d = new Date(), h = d.getHours();
  $("ora").textContent = h + ":" + due(d.getMinutes());
  $("data").textContent = GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()];
  document.body.classList.toggle("notte", h >= 23 || h < 7);
}

// ================= meteo =================
var METEO = null;
function icona(c) { return c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c === 45 || c === 48 ? "🌫️" : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? "🌧️" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "🌨️" : c >= 95 ? "⛈️" : "☁️"; }
function descr(c) { return c === 0 ? "sereno" : c <= 2 ? "poco nuvoloso" : c === 3 ? "coperto" : c === 45 || c === 48 ? "nebbia" : c >= 95 ? "temporale" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "neve" : c >= 51 ? "pioggia" : ""; }
function tipoMeteo(c) { return c >= 95 ? "temporale" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "neve" : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? "pioggia" : c === 45 || c === 48 ? "nebbia" : c === 3 ? "coperto" : c >= 1 ? "nuvoloso" : "sereno"; }
var PROVA = (/[?&]prova=(\w+)/.exec(location.search) || [])[1];   // ?prova=pioggia|neve|temporale|nebbia|sereno|nuvoloso per vederla subito
function leggiMeteo() {
  if (PROVA) { var c = { pioggia: 63, neve: 73, temporale: 95, nebbia: 45, sereno: 0, nuvoloso: 2, coperto: 3 }[PROVA]; METEO = { current: { temperature_2m: 8, weather_code: c, wind_speed_10m: 15, wind_direction_10m: 250, precipitation: 2, is_day: /notte/.test(location.search) ? 0 : 1 }, daily: { weather_code: [c, 3], temperature_2m_max: [12, 13], temperature_2m_min: [5, 6], precipitation_probability_max: [80, 30] } }; disegnaMeteo(); return; }
  fetch("https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current=temperature_2m,weather_code,precipitation,wind_speed_10m,wind_direction_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=2")
    .then(function (r) { return r.json(); }).then(function (j) { METEO = j; disegnaMeteo(); }, function () {});
}
function disegnaMeteo() {
  var j = METEO; if (!j || !j.current) return;
  var m = $("c-meteo"), d = j.daily;
  m.querySelector(".ic").textContent = icona(j.current.weather_code);
  m.querySelector(".gr").textContent = Math.round(j.current.temperature_2m) + "°";
  m.querySelector(".tx").innerHTML = "<b>" + descr(j.current.weather_code) + "</b><br>domani " + icona(d.weather_code[1]) + " " + Math.round(d.temperature_2m_min[1]) + "° / " + Math.round(d.temperature_2m_max[1]) + "°" +
    (d.precipitation_probability_max[1] >= 50 ? " · pioggia " + d.precipitation_probability_max[1] + "%" : "");
  ANIM.tipo = tipoMeteo(j.current.weather_code); ANIM.mm = j.current.precipitation || 0; ANIM.vento = j.current.wind_speed_10m || 0;
  ANIM.verso = j.current.wind_direction_10m || 0; ANIM.giorno = j.current.is_day !== 0; preparaAnim();
}

// ================= noi, domani, in arrivo =================
function doveAdesso(p) {
  var r = rientroDi(p);
  if (r && Date.now() < r.arrivo) { var resta = Math.max(0, Math.round((r.arrivo - Date.now()) / 60000)); return "<em>sta tornando</em> · arriva alle " + oraHM(r.arrivo) + (resta > 1 ? " (tra " + resta + " min)" : ""); }
  var f = fuoriDi(p); if (f) return "<em>fuori</em> · " + testoSicuro(f.dove);
  var st = statoAdesso(p);
  if (st.stato === "lavoro") return "<em>al lavoro</em> · " + st.cosa.replace(/^al lavoro /, "");
  var h = new Date().getHours();
  return "<em>" + (h >= 23 || h < 7 ? "a nanna" : "a casa") + "</em>";
}
function disegnaNoi() {
  var html = "";
  [0, 1].forEach(function (p) { html += '<div class="persona p' + p + '"><div class="av">' + testoSicuro(nome(p).charAt(0).toUpperCase()) + '</div><div class="tx"><b>' + testoSicuro(nome(p)) + '</b><span>' + doveAdesso(p) + '</span></div></div>'; });
  $("noi").innerHTML = html;
  var dom = piuGiorni(new Date(), 1); html = "";
  $("domani-tit").textContent = "Domani · " + GIORNI[dom.getDay()];
  [0, 1].forEach(function (p) { var v = turno(dom, p); html += '<div class="riga"><b>' + testoSicuro(nome(p)) + '</b> <span style="color:var(--muted)">' + (v ? testoSicuro(ordinato(v).replace(/:00/g, "").replace(/\s*\/\s*/g, " · ")) : "riposo") + '</span></div>'; });
  $("domani").innerHTML = html;
}
function quando(d) {
  var o = new Date(), oggi = new Date(o.getFullYear(), o.getMonth(), o.getDate()), n = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - oggi) / 864e5);
  return n === 0 ? "oggi" : n === 1 ? "domani" : n < 7 ? GIORNI[d.getDay()] : d.getDate() + " " + MESI[d.getMonth()].slice(0, 3);
}
function disegnaArrivo() {
  var l = [], o = new Date(), k = iso(o), hm = due(o.getHours()) + ":" + due(o.getMinutes()), fine = iso(piuGiorni(o, 7));
  (cfg.eventi || []).filter(function (e) { return (e.data > k || (e.data === k && (!e.ora || e.ora >= hm))) && e.data <= fine; })
    .forEach(function (e) { l.push({ t: e.data + (e.ora || "99"), html: "📅 " + testoSicuro(e.testo) + '<span class="q">' + quando(daIso(e.data)) + (e.ora ? " alle " + e.ora : "") + "</span>" }); });
  for (var i = 0; i <= 7; i++) {
    var d = piuGiorni(o, i);
    if (window.compleanniDel) compleanniDel(d).forEach(function (c) { l.push({ t: iso(d), html: "🎂 " + testoSicuro(c.nome) + '<span class="q">compleanno · ' + quando(d) + "</span>" }); });
    if (window.festeDel) festeDel(d).forEach(function (f) { l.push({ t: iso(d), html: f.ico + " " + testoSicuro(f.nome) + '<span class="q">' + quando(d) + "</span>" }); });
  }
  l.sort(function (a, b) { return a.t.localeCompare(b.t); });
  var n = spesa.filter(function (v) { return !v.fatto; }).length;
  if (n) l.push({ html: "🛒 " + n + (n === 1 ? " cosa" : " cose") + ' da prendere<span class="q">nella spesa</span>' });
  $("arrivo").innerHTML = l.length ? l.slice(0, 6).map(function (x) { return '<div class="riga">' + x.html + "</div>"; }).join("") : '<div class="riga" style="color:var(--muted)">Niente in vista: serata tranquilla ♥</div>';
}

// ================= foto: le stesse del carosello, una ogni 20 secondi =================
var FOTO = { lista: [], i: 0, vista: 0, url: {}, letta: 0 };
function aggiornaFoto() {
  if (!token || !chiaveCripto || Date.now() - FOTO.letta < 20 * 60000) return;
  FOTO.letta = Date.now();
  listaFotoRemote().then(function (l) {
    FOTO.lista = l.sort(function () { return Math.random() - .5; });
    $("foto-vuoto").hidden = !!l.length; if (l.length && !FOTO.mostrata) mostraFoto(0);
  }, function () { FOTO.letta = 0; });
}
function urlFoto(x) { return FOTO.url[x.sha] ? Promise.resolve(FOTO.url[x.sha]) : scaricaFotoRemota(x).then(function (b) { return (FOTO.url[x.sha] = URL.createObjectURL(b)); }); }
function mostraFoto(i) {
  var n = FOTO.lista.length; if (!n) return;
  FOTO.i = (i % n + n) % n; var x = FOTO.lista[FOTO.i];
  urlFoto(x).then(function (u) {
    var imgs = $("foto").getElementsByTagName("img"), nuova = imgs[FOTO.vista ? 0 : 1], vecchia = imgs[FOTO.vista ? 1 : 0];
    nuova.onload = function () { nuova.className = "on"; vecchia.className = ""; FOTO.vista = FOTO.vista ? 0 : 1; FOTO.mostrata = true; $("sfondo").style.backgroundImage = "url(" + u + ")"; };
    nuova.src = u;
    var dopo = FOTO.lista[(FOTO.i + 1) % n]; if (dopo !== x) urlFoto(dopo).catch(function () {});
    var tieni = {}; tieni[x.sha] = 1; tieni[dopo.sha] = 1;
    Object.keys(FOTO.url).forEach(function (k) { if (!tieni[k]) { URL.revokeObjectURL(FOTO.url[k]); delete FOTO.url[k]; } });
  }, function () {});
}
$("foto").onclick = function () { mostraFoto(FOTO.i + 1); };

// ================= meteo animato sopra l'interfaccia =================
var ANIM = { tipo: "", mm: 0, vento: 0, verso: 0, giorno: true, p: [], nuvole: [], lampo: 0, prossimoLampo: 0, W: 0, H: 0, dpr: 1, ultimo: 0 };
var tela = $("meteo-anim"), g = tela.getContext("2d");
function misuraAnim() {
  var sc = $("scena"); ANIM.W = sc.clientWidth; ANIM.H = sc.clientHeight; ANIM.dpr = Math.min(1.5, window.devicePixelRatio || 1);
  tela.width = ANIM.W * ANIM.dpr; tela.height = ANIM.H * ANIM.dpr; preparaAnim();
}
function preparaAnim() {
  var W = ANIM.W, H = ANIM.H, t = ANIM.tipo, i; ANIM.p = []; ANIM.nuvole = [];
  if (!W) return;
  var n = t === "neve" ? Math.round(70 + ANIM.mm * 50) : t === "pioggia" || t === "temporale" ? Math.round(70 + ANIM.mm * 70) : 0;
  for (i = 0; i < Math.min(n, 300); i++) ANIM.p.push({ x: Math.random() * W, y: Math.random() * H, v: .6 + Math.random() * .8, r: Math.random() });
  var nn = t === "coperto" || t === "pioggia" || t === "temporale" || t === "neve" ? 6 : t === "nuvoloso" ? 4 : t === "nebbia" ? 5 : 0;
  for (i = 0; i < nn; i++) ANIM.nuvole.push({ x: Math.random() * W, y: (t === "nebbia" ? .45 + Math.random() * .5 : Math.random() * .22) * H, s: (.7 + Math.random() * .8) * Math.max(W, H) / 900, v: .25 + Math.random() * .4 });
  if (t === "sereno" && !ANIM.giorno) for (i = 0; i < 60; i++) ANIM.p.push({ x: Math.random() * W, y: Math.random() * H * .5, r: Math.random(), f: Math.random() * 6, stella: true });
}
function ventoX() { return Math.max(-30, Math.min(30, -Math.sin(ANIM.verso * Math.PI / 180) * ANIM.vento)); }
function nuvola(x, y, s, a, col) {   // una nuvola morbida fatta di sbuffi
  [[0, 0, 60], [55, -18, 50], [105, 2, 56], [40, 18, 52], [-40, 12, 44]].forEach(function (b) {
    var r = b[2] * s, gr = g.createRadialGradient(x + b[0] * s, y + b[1] * s, 0, x + b[0] * s, y + b[1] * s, r);
    gr.addColorStop(0, "rgba(" + col + "," + a + ")"); gr.addColorStop(1, "rgba(" + col + ",0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x + b[0] * s, y + b[1] * s, r, 0, 7); g.fill();
  });
}
function ricicla(p, W, H) { if (p.y > H + 20) { p.y = -20 - Math.random() * 60; p.x = Math.random() * (W + 200) - 100; } if (p.x > W + 120) p.x -= W + 200; if (p.x < -120) p.x += W + 200; }
function frame(ora) {
  requestAnimationFrame(frame);
  if (ora - ANIM.ultimo < 33) return;   // circa 30 al secondo
  var dt = Math.min(100, ora - ANIM.ultimo) / 1000; ANIM.ultimo = ora;
  var W = ANIM.W, H = ANIM.H, t = ANIM.tipo, vx = ventoX(), i;
  g.setTransform(ANIM.dpr, 0, 0, ANIM.dpr, 0, 0); g.clearRect(0, 0, W, H);
  if (!t) return;
  if ((t === "sereno" || t === "nuvoloso") && ANIM.giorno) {   // sole: un bagliore caldo che respira, con raggi lenti
    var cx = W * .86, cy = -H * .05, k = .5 + .5 * Math.sin(ora / 2600), r = Math.max(W, H) * .55;
    var gl = g.createRadialGradient(cx, cy, 0, cx, cy, r); gl.addColorStop(0, "rgba(255,214,140," + (.22 + k * .06).toFixed(3) + ")"); gl.addColorStop(1, "rgba(255,214,140,0)");
    g.fillStyle = gl; g.fillRect(0, 0, W, H);
    g.save(); g.translate(cx, cy); g.rotate(ora / 40000);
    for (i = 0; i < 9; i++) { g.rotate(Math.PI * 2 / 9); var rg = g.createLinearGradient(0, 0, r, 0); rg.addColorStop(0, "rgba(255,230,170,.10)"); rg.addColorStop(1, "rgba(255,230,170,0)"); g.fillStyle = rg; g.beginPath(); g.moveTo(0, 0); g.lineTo(r, -r * .06); g.lineTo(r, r * .06); g.fill(); }
    g.restore();
  }
  ANIM.p.forEach(function (s) { if (!s.stella) return; g.fillStyle = "rgba(255,255,255," + (.25 + .55 * Math.abs(Math.sin(ora / 1800 + s.f))).toFixed(2) + ")"; g.beginPath(); g.arc(s.x, s.y, .6 + s.r, 0, 7); g.fill(); });   // stelle
  ANIM.nuvole.forEach(function (n) {   // nuvole e nebbia che passano col vento
    n.x += (6 + Math.abs(vx)) * n.v * dt * (vx < 0 ? -1 : 1);
    if (n.x > W + 200 * n.s) n.x = -200 * n.s; if (n.x < -200 * n.s) n.x = W + 200 * n.s;
    if (t === "nebbia") nuvola(n.x, n.y, n.s * 2.2, .16, "225,228,235");
    else nuvola(n.x, n.y, n.s, t === "nuvoloso" ? .14 : .2, t === "temporale" ? "90,95,110" : "200,205,215");
  });
  if (t === "neve") {
    g.fillStyle = "rgba(255,255,255,.85)";
    ANIM.p.forEach(function (p) { p.y += (26 + p.v * 30) * dt; p.x += (vx * 1.2 + Math.sin(ora / 900 + p.r * 9) * 14) * dt; g.beginPath(); g.arc(p.x, p.y, 1.2 + p.r * 2.4, 0, 7); g.fill(); ricicla(p, W, H); });
  } else if (t === "pioggia" || t === "temporale") {
    g.strokeStyle = "rgba(190,210,240,.38)"; g.lineWidth = 1.2; g.beginPath();
    ANIM.p.forEach(function (p) { var vy = 620 + p.v * 380, sp = vx * 9; p.y += vy * dt; p.x += sp * dt; g.moveTo(p.x, p.y); g.lineTo(p.x - sp * .028, p.y - (12 + p.v * 12)); ricicla(p, W, H); });
    g.stroke();
  }
  if (t === "temporale") {   // lampi
    if (ora > ANIM.prossimoLampo) { ANIM.lampo = 1; ANIM.prossimoLampo = ora + 6000 + Math.random() * 14000; }
    if (ANIM.lampo > .02) { g.fillStyle = "rgba(230,235,255," + (ANIM.lampo * .45).toFixed(3) + ")"; g.fillRect(0, 0, W, H); ANIM.lampo *= .8; }
  }
}

// ================= girare lo schermo (anche con la rotazione automatica spenta) =================
// ⟳ automatico · ▭ orizzontale · ▭ orizzontale al contrario · ▯ verticale
var verso = leggi("salotto_verso", "auto");
function applicaVerso() {
  var sc = $("scena"), w = innerWidth, h = innerHeight, giro = 0;
  if ((verso === "dx" || verso === "sx") && h > w) giro = verso === "dx" ? 90 : -90;
  if (verso === "vert" && w > h) giro = 90;
  var tr = giro ? (giro > 0 ? "translateX(" + w + "px) rotate(90deg)" : "translateY(" + h + "px) rotate(-90deg)") : "";
  sc.style.width = (giro ? h : w) + "px"; sc.style.height = (giro ? w : h) + "px"; sc.style.webkitTransform = tr; sc.style.transform = tr;
  var ow = giro ? h : w, oh = giro ? w : h;
  document.body.classList.toggle("oriz", ow > oh); document.body.classList.toggle("vert", ow <= oh);
  $("b-ruota").textContent = { auto: "⟳", dx: "▭", sx: "▭", vert: "▯" }[verso];
  misuraAnim();
}
$("b-ruota").onclick = function (e) {
  e.stopPropagation(); var l = ["auto", "dx", "sx", "vert"]; verso = l[(l.indexOf(verso) + 1) % l.length]; salva("salotto_verso", verso); applicaVerso();
  this.style.opacity = 1; clearTimeout(this.t); var b = this; b.t = setTimeout(function () { b.style.opacity = ""; }, 3000);
};
window.addEventListener("resize", applicaVerso);

// ================= tutto insieme =================
function disegna() { disegnaOra(); disegnaNoi(); disegnaArrivo(); }
function ridisegna() { disegna(); }
function dopoSblocco() { FOTO.letta = 0; aggiornaFoto(); }
function tieniAcceso() { if ("wakeLock" in navigator && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {}); }
document.addEventListener("visibilitychange", tieniAcceso);
document.addEventListener("click", function () { var e = document.documentElement; if (!document.fullscreenElement && e.requestFullscreen) e.requestFullscreen().catch(function () {}); });

applicaVerso(); disegna(); leggiMeteo(); tieniAcceso(); requestAnimationFrame(frame);
setInterval(function () { if (new Date().getSeconds() < 5) disegna(); else disegnaOra(); }, 5000);
setInterval(function () { mostraFoto(FOTO.i + 1); }, 20000);
setInterval(leggiMeteo, 30 * 60000);
setInterval(aggiornaFoto, 60000);
avviaSync();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
